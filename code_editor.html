});

document.getElementById('confirmRenameBtn').addEventListener('click', async () => {
  const newName = document.getElementById('renameInput').value.trim();
  if (!newName || !currentFileId) return;
  const file = files.find(f => f.id === currentFileId);
  if (!file) return;
  if (files.some(f => f.id !== currentFileId && f.name === newName)) {
    showToast('같은 이름의 파일이 있어요');
    return;
  }
  file.name = newName;
  file.updatedAt = Date.now();
  // 확장자로 언어 자동 갱신
  const ext = newName.split('.').pop().toLowerCase();
  file.language = (ext === 'py') ? 'python' : 'text';
  try {
    await dbPut(file);
    closeRenameModal();
    document.getElementById('currentFileName').textContent = file.name;
    if (editor) editor.setOption('mode', file.language === 'python' ? 'python' : 'text/plain');
    renderFileList();
    showToast('이름 변경됨');
  } catch (err) {
    showToast('변경 실패');
  }
});

// ============ DELETE ============
document.getElementById('deleteBtn').addEventListener('click', async () => {
  if (!currentFileId) return;
  const file = files.find(f => f.id === currentFileId);
  if (!file) return;
  if (!confirm(`"${file.name}"을 삭제할까요? 되돌릴 수 없어요.`)) return;
  try {
    await dbDelete(currentFileId);
    files = files.filter(f => f.id !== currentFileId);
    currentFileId = null;
    if (editor) {
      editor.toTextArea();
      editor = null;
    }
    document.getElementById('editorHeader').style.display = 'none';
    // empty state 복구
    const container = document.getElementById('editorContainer');
    container.innerHTML = `
      <div class="empty-state" id="emptyState">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
        </svg>
        <h3>파일이 삭제됐어요</h3>
        <p>다른 파일을 선택하거나 새로 만드세요.</p>
      </div>
    `;
    renderFileList();
    showToast('삭제됨');
  } catch (err) {
    showToast('삭제 실패');
  }
});

// ============ DOWNLOAD ============
document.getElementById('downloadBtn').addEventListener('click', () => {
  if (!currentFileId) return;
  const file = files.find(f => f.id === currentFileId);
  if (!file) return;
  // 저장 후 다운로드
  if (editor) file.content = editor.getValue();
  downloadFile(file);
});

function downloadFile(file) {
  const blob = new Blob([file.content], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = file.name;
  a.click();
  URL.revokeObjectURL(url);
}

document.getElementById('downloadZipBtn').addEventListener('click', async () => {
  if (files.length === 0) {
    showToast('다운로드할 파일이 없어요');
    return;
  }
  // 현재 파일 자동 저장
  if (currentFileId && isDirty) await saveCurrentFile(true);
  // 각 파일을 순서대로 다운로드 (브라우저가 한꺼번에 처리)
  for (const file of files) {
    downloadFile(file);
    await new Promise(r => setTimeout(r, 200));
  }
  showToast(`${files.length}개 파일 다운로드 시작`);
});

// ============ BACKUP / RESTORE ============
document.getElementById('exportAllBtn').addEventListener('click', async () => {
  if (currentFileId && isDirty) await saveCurrentFile(true);
  const blob = new Blob([JSON.stringify(files, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `gaegle_code_${stamp}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast(`${files.length}개 파일 백업 완료`);
});

document.getElementById('importBtn').addEventListener('click', () => {
  document.getElementById('importFile').click();
});

document.getElementById('importFile').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    if (!Array.isArray(data)) throw new Error('Invalid format');
    if (!confirm(`${data.length}개 파일을 가져올까요? (기존 데이터는 유지됩니다)`)) return;
    let count = 0;
    for (const item of data) {
      if (item.id && item.name) {
        await dbPut(item);
        count++;
      }
    }
    await loadFiles();
    showToast(`${count}개 파일 복원 완료`);
  } catch (err) {
    showToast('파일을 읽을 수 없어요');
    console.error(err);
  }
  e.target.value = '';
});

// ============ INITIAL SEED ============
document.getElementById('seedBtn').addEventListener('click', async () => {
  let seedData;
  try {
    seedData = JSON.parse(INITIAL_CODE_DATA);
  } catch (err) {
    showToast('초기 데이터 파싱 실패');
    return;
  }
  // 이미 존재하는 파일은 건너뜀
  const existingNames = new Set(files.map(f => f.name));
  const toAdd = seedData.filter(s => !existingNames.has(s.name));
  if (toAdd.length === 0) {
    showToast('이미 모든 초기 파일이 있어요');
    return;
  }
  if (!confirm(`${toAdd.length}개 파일을 추가할까요?`)) return;
  for (const item of toAdd) {
    // 새 ID 발급 (충돌 방지)
    item.id = `file_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
    await dbPut(item);
  }
  await loadFiles();
  showToast(`${toAdd.length}개 파일 추가됨`);
  // 첫 파일 자동 선택
  if (!currentFileId && files.length > 0) {
    // config.py가 있으면 그것부터, 없으면 첫 파일
    const config = files.find(f => f.name === 'config.py');
    selectFile(config ? config.id : files[0].id);
  }
});

// ============ SAVE BUTTON ============
document.getElementById('saveBtn').addEventListener('click', () => saveCurrentFile(false));

// ============ INIT ============
async function loadFiles() {
  files = await dbGetAll();
  renderFileList();
}

(async () => {
  try {
    await openDB();
    await loadFiles();
    if (files.length === 0) {
      // 빈 상태 - empty state가 자동으로 보임
    }
  } catch (err) {
    console.error('DB error', err);
    showToast('저장소를 열 수 없어요');
  }
})();

// 페이지 떠나기 전 자동 저장
window.addEventListener('beforeunload', () => {
  if (currentFileId && isDirty && editor) {
    const file = files.find(f => f.id === currentFileId);
    if (file) {
      file.content = editor.getValue();
      file.updatedAt = Date.now();
      // 동기적으로 저장 시도 (best effort)
      dbPut(file);
    }
  }
});
</script>
