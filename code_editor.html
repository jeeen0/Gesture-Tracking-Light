\n        self.last_delta_tilt_deg = 0.0\\n        self.point_target = None\\n        self.point_display_target = None\\n        self.point_stable_ratio = 0.0\\n        self.point_std_px = 0.0\\n\\n        # ── 서보 (모터) 제어 ── 0521_v2m\\n        self.servo = None\\n        try:\\n            self.servo = ServoController()\\n            emit(\\"servo_ready\\")\\n        except Exception as e:\\n            emit(\\"servo_error\\", error=str(e))\\n            print(f\\"[PI] ServoController init failed (DRY mode): {e}\\", flush=True)\\n\\n        # 서보 절대 각도 (0~180°, 중앙=90°)\\n        self.servo_pan_deg = 90.0\\n        self.servo_tilt_deg = 90.0\\n\\n        # ── Fisheye 카메라 보정 (있으면 frame 보정 + 실제 intrinsics 사용) ──\\n        self.undistorter = None\\n        if ENABLE_FISHEYE_UNDISTORT and FisheyeUndistorter is not None:\\n            try:\\n                self.undistorter = FisheyeUndistorter(\\n                    FISHEYE_CALIB_PATH, (FRAME_W, FRAME_H)\\n                )\\n                emit(\\n                    \\"undistort_ready\\",\\n                    file=FISHEYE_CALIB_PATH,\\n                    fx=round(self.undistorter.fx, 2),\\n                    fy=round(self.undistorter.fy, 2),\\n                    cx=round(self.undistorter.cx, 2),\\n                    cy=round(self.undistorter.cy, 2),\\n                    rms=round(self.undistorter.rms, 3),\\n                )\\n            except Exception as e:\\n                emit(\\"undistort_unavailable\\", file=FISHEYE_CALIB_PATH, error=str(e))\\n                print(f\\"[PI] Fisheye undistort 비활성: {e}\\", flush=True)\\n\\n        self.point_estimator = None\\n        self.point_status = \\"idle\\"\\n        self.point_error = None\\n        self.point_preload_started = False\\n        self.yolo_model = None\\n        self.yolo_status = \\"idle\\"\\n        self.yolo_error = None\\n        self.yolo_preload_started = False\\n        self.last_brightness_gesture = None\\n        self.last_brightness_time = 0.0\\n        self.latched_gesture = None\\n        self.hold_gesture = None\\n        self.hold_start_time = 0.0\\n        self.load_state()\\n\\n    def start_preloads(self):\\n        self.start_point_preload()\\n        self.start_yolo_preload()\\n\\n    def load_state(self):\\n        if not os.path.exists(STATE_FILE):\\n            return\\n        try:\\n            with open(STATE_FILE, \\"r\\", encoding=\\"utf-8\\") as f:\\n                data = json.load(f)\\n            self.saved_brightness = clamp(int(data.get(\\"brightness\\", self.saved_brightness)), 0, MAX_BRIGHTNESS)\\n            self.power = False\\n            self.brightness = 0\\n            self.mode = data.get(\\"mode\\", self.mode)\\n            self.pan_deg = float(data.get(\\"pan_deg\\", self.pan_deg))\\n            self.tilt_deg = float(data.get(\\"tilt_deg\\", self.tilt_deg))\\n            self.preview_pan_deg = self.pan_deg\\n            self.preview_tilt_deg = self.tilt_deg\\n            self.point_target = data.get(\\"point_target\\", self.point_target)\\n            # 서보 절대 각도 복원 (저장된 값이 없으면 90° 중앙 유지) 0521_v2m\\n            self.servo_pan_deg = float(data.get(\\"servo_pan_deg\\", self.servo_pan_deg))\\n            self.servo_tilt_deg = float(data.get(\\"servo_tilt_deg\\", self.servo_tilt_deg))\\n            if self.servo is not None:\\n                self.servo.move_to(self.servo_pan_deg, self.servo_tilt_deg)\\n            emit(\\"state_loaded\\", file=STATE_FILE, saved_brightness=self.saved_brightness, mode=self.mode)\\n        except Exception as e:\\n            emit(\\"state_load_error\\", file=STATE_FILE, error=str(e))\\n\\n    def save_state(self):\\n        data = {\\n            \\"power\\": self.power,\\n            \\"brightness\\": self.saved_brightness,\\n            \\"mode\\": self.mode,\\n            \\"pan_deg\\": self.pan_deg,\\n            \\"tilt_deg\\": self.tilt_deg,\\n            \\"point_target\\": self.point_target,\\n            \\"servo_pan_deg\\": self.servo_pan_deg,  # 0521_v2m\\n            \\"servo_tilt_deg\\": self.servo_tilt_deg,\\n        }\\n        try:\\n            with open(STATE_FILE, \\"w\\", encoding=\\"utf-8\\") as f:\\n                json.dump(data, f, ensure_ascii=False, indent=2)\\n        except Exception as e:\\n            emit(\\"state_save_error\\", file=STATE_FILE, error=str(e))\\n\\n    def start_point_preload(self):\\n        if not ENABLE_POINTING or not PRELOAD_POINTING or self.point_preload_started:\\n            return\\n        self.point_preload_started = True\\n        threading.Thread(target=self._preload_pointing, daemon=True).start()\\n\\n    def _preload_pointing(self):\\n        if PointingTargetEstimator is None:\\n            self.point_status = \\"module_unavailable\\"\\n            return\\n        try:\\n            self.point_status = \\"preloading\\"\\n            self.point_estimator = PointingTargetEstimator(\\n                FRAME_W, FRAME_H, **self._pointing_intrinsics()\\n            )\\n            self.point_status = \\"ready\\"\\n            emit(\\"pointing_ready\\")\\n        except Exception as e:\\n            self.point_estimator = None\\n            self.point_error = str(e)\\n            self.point_status = f\\"preload_error:{e}\\"\\n            emit(\\"pointing_error\\", error=str(e))\\n\\n    def _pointing_intrinsics(self):\\n        \\"\\"\\"undistorter가 있으면 실제 intrinsics, 없으면 빈 dict (PointingTargetEstimator가 기본 추정값 사용).\\"\\"\\"\\n        if self.undistorter is None:\\n            return {}\\n        return {\\n            \\"cam_fx\\": self.undistorter.fx,\\n            \\"cam_fy\\": self.undistorter.fy,\\n            \\"cx\\": self.undistorter.cx,\\n            \\"cy\\": self.undistorter.cy,\\n        }\\n\\n    def start_yolo_preload(self):\\n        if not ENABLE_YOLO or not PRELOAD_YOLO or self.yolo_preload_started:\\n            return\\n        self.yolo_preload_started = True\\n        threading.Thread(target=self._preload_yolo, daemon=True).start()\\n\\n    def _preload_yolo(self):\\n        try:\\n            self.yolo_status = \\"preloading\\"\\n            from ultralytics import YOLO\\n\\n            self.yolo_model = YOLO(YOLO_MODEL_PATH)\\n            self.yolo_status = \\"ready\\"\\n            emit(\\"yolo_ready\\", model=YOLO_MODEL_PATH)\\n        except Exception as e:\\n            self.yolo_model = None\\n            self.yolo_error = str(e)\\n            self.yolo_status = f\\"preload_error:{e}\\"\\n            emit(\\"yolo_error\\", model=YOLO_MODEL_PATH, error=str(e))\\n\\n    def wake(self):\\n        self.standby = False\\n        self.active_until = time.time() + ACTIVE_TIMEOUT_SECONDS\\n        self.point_mode = False\\n        self.point_display_target = None\\n        self.point_stable_ratio = 0.0\\n        self.point_std_px = 0.0\\n        if self.point_status not in (\\"preloading\\", \\"ready\\"):\\n            self.point_status = \\"idle\\"\\n        self.power = True\\n        self.brightness = self.saved_brightness\\n        # sleep() 시 PWM이 꺼져 있을 수 있으니 마지막 위치로 재기동\\n        if self.servo is not None:\\n            self.servo.move_to(self.servo_pan_deg, self.servo_tilt_deg)\\n        self.save_state()\\n        emit(\\"wake\\", brightness=self.brightness)\\n\\n    def sleep(self):\\n        self.standby = True\\n        self.active_until = 0.0\\n        self.point_mode = False\\n        self.power = False\\n        self.brightness = 0\\n        self.save_state()\\n        # 서보 PWM 해제 (전류 절약, 서보 위치는 state에 저장됨) 0521_v2m\\n        if self.servo is not None:\\n            self.servo.shutdown()\\n        emit(\\"sleep\\")\\n\\n    def update_activity_timeout(self, hand_detected):\\n        if self.standby:\\n            return\\n        if hand_detected or KEEP_AWAKE:\\n            self.active_until = time.time() + ACTIVE_TIMEOUT_SECONDS\\n            return\\n        if time.time() >= self.active_until:\\n            self.sleep()\\n\\n    def enter_point_mode(self):\\n        self.point_mode = True\\n        # mode(조명 모드: Spot/Mood)는 건드리지 않음 — point_mode는 별도 플래그\\n        self.point_target = None\\n        self.point_display_target = None\\n        self.point_stable_ratio = 0.0\\n        self.point_std_px = 0.0\\n        if self.point_estimator:\\n            self.point_estimator.reset(clear_confirmed=True)\\n        self.save_state()\\n        emit(\\"point_mode\\", enabled=True)\\n\\n    def _reset_hold(self):\\n        self.hold_gesture = None\\n        self.hold_start_time = 0.0\\n\\n    def _hold_ready(self, gesture):\\n        now = time.time()\\n        if self.hold_gesture != gesture:\\n            self.hold_gesture = gesture\\n            self.hold_start_time = now\\n            return False\\n        return now - self.hold_start_time >= COMMAND_HOLD_SECONDS\\n\\n    def apply_brightness_gesture(self, gesture):\\n        now = time.time()\\n        if now - self.last_brightness_time < BRIGHTNESS_UPDATE_INTERVAL:\\n            return\\n        old = self.brightness\\n        if gesture == \\"THUMBS_UP\\":\\n            self.brightness = clamp(old + BRIGHTNESS_STEP, MIN_BRIGHTNESS, MAX_BRIGHTNESS)\\n        elif gesture == \\"THUMBS_DOWN\\":\\n            self.brightness = clamp(old - BRIGHTNESS_STEP, MIN_BRIGHTNESS, MAX_BRIGHTNESS)\\n        else:\\n            return\\n        self.power = self.brightness > 0\\n        self.last_brightness_time = now\\n        if self.brightness != old:\\n            self.saved_brightness = self.brightness\\n            self.last_brightness_gesture = gesture\\n            self.save_state()\\n            emit(\\"brightness\\", gesture=gesture, brightness=self.brightness, delta=self.brightness - old)\\n\\n    def update_point_target(self, frame, hand_landmarks):\\n        if not ENABLE_POINTING:\\n            self.point_status = \\"disabled\\"\\n            return\\n        if self.point_estimator is None:\\n            if self.point_preload_started and self.point_status == \\"preloading\\":\\n                # 프리로딩이 아직 진행 중이면 잠시 대기하되,\\n                # 10초 이상 걸리면 동기 생성으로 전환 (2D fallback이라도 동작)\\n                if not hasattr(self, '_preload_wait_start'):\\n                    self._preload_wait_start = time.time()\\n                if time.time() - self._preload_wait_start < 10.0:\\n                    return\\n                print(\\"[PI] preload timeout, creating estimator synchronously\\", flush=True)\\n            self.point_status = \\"loading\\"\\n            if PointingTargetEstimator is None:\\n                self.point_status = \\"module_unavailable\\"\\n                emit(\\"pointing_error\\", error=\\"PointingTargetEstimator module not available\\")\\n                return\\n            self.point_estimator = PointingTargetEstimator(\\n                FRAME_W, FRAME_H, **self._pointing_intrinsics()\\n            )\\n            self.point_status = \\"ready\\"\\n            emit(\\"pointing_ready\\", method=\\"sync_fallback\\")\\n\\n        target = self.point_estimator.update(frame, hand_landmarks)\\n        if target.get(\\"depth_available\\") is False:\\n            self.point_status = \\"tracking_2d_fallback\\"\\n        elif target.get(\\"used_depth_hit\\"):\\n            self.point_status = \\"tracking_depth\\"\\n        else:\\n            self.point_status = \\"tracking_depth_fallback\\"\\n        self.point_display_target = target.get(\\"display_target\\")\\n        self.point_stable_ratio = float(target.get(\\"stable_ratio\\", 0.0))\\n        self.point_std_px = float(target.get(\\"std_px\\", 0.0))\\n        if target.get(\\"pan_deg\\") is not None:\\n            self.preview_pan_deg = float(target[\\"pan_deg\\"])\\n            self.preview_tilt_deg = float(target[\\"tilt_deg\\"])\\n        if target.get(\\"confirmed\\") and target[\\"confirmed\\"] != self.point_target:\\n            previous_pan = self.pan_deg\\n            previous_tilt = self.tilt_deg\\n            if target.get(\\"pan_deg\\") is not None:\\n                self.pan_deg = float(target[\\"pan_deg\\"])\\n                self.tilt_deg = float(target[\\"tilt_deg\\"])\\n            self.last_delta_pan_deg = self.pan_deg - previous_pan\\n            self.last_delta_tilt_deg = self.tilt_deg - previous_tilt\\n            self.point_target = target[\\"confirmed\\"]\\n            self.point_mode = False\\n            self.point_status = \\"locked\\"\\n\\n            # ── 서보 구동: 상대 각도(delta)를 현재 서보 위치에 적용 ── 0521_v2m\\n            # pan_deg/tilt_deg는 카메라 중심 기준 상대 각도.\\n            # 서보 절대 각도 = 현재 서보 위치 + delta\\n            # 부호 규칙: 카메라 오른쪽(+pan) → 서보도 +방향\\n            #           카메라 아래쪽(+tilt) → 서보도 +방향\\n            # ※ 카메라-서보 방향이 반대면 부호를 뒤집을 것 (현장 캘리브레이션)\\n            new_servo_pan = self.servo_pan_deg + self.last_delta_pan_deg * SERVO_PAN_SIGN\\n            new_servo_tilt = self.servo_tilt_deg + self.last_delta_tilt_deg * SERVO_TILT_SIGN\\n            self.servo_pan_deg = new_servo_pan\\n            self.servo_tilt_deg = new_servo_tilt\\n            if self.servo is not None:\\n                self.servo.move_to(new_servo_pan, new_servo_tilt)\\n                emit(\\n                    \\"servo_moved\\",\\n                    servo_pan=round(new_servo_pan, 2),\\n                    servo_tilt=round(new_servo_tilt, 2),\\n                    delta_pan=round(self.last_delta_pan_deg, 2),\\n                    delta_tilt=round(self.last_delta_tilt_deg, 2),\\n                )\\n\\n            self.save_state()\\n            emit(\\n                \\"point_target_locked\\",\\n                target_px=self.point_target,\\n                pan_deg=round(self.pan_deg, 2),\\n                tilt_deg=round(self.tilt_deg, 2),\\n                previous_pan_deg=round(previous_pan, 2),\\n                previous_tilt_deg=round(previous_tilt, 2),\\n                delta_pan_deg=round(self.last_delta_pan_deg, 2),\\n                delta_tilt_deg=round(self.last_delta_tilt_deg, 2),\\n                std_px=round(target.get(\\"std_px\\", 0.0), 1),\\n                hit_method=target.get(\\"hit_method\\"),\\n                used_depth_hit=target.get(\\"used_depth_hit\\"),\\n            )\\n            emit(\\"point_mode\\", enabled=False, reason=\\"target_locked\\")\\n\\n    def apply_gesture(self, gesture, results, frame, wave_active):\\n        if gesture is None:\\n            # point_mode 활성화 중에는 제스처가 잠깐 끊겨도 point_mode 유지\\n            if not self.point_mode:\\n                self.latched_gesture = None\\n                self._reset_hold()\\n            return None\\n\\n        if self.standby:\\n            if gesture == \\"WAVE\\" and wave_active:\\n                self.wake()\\n                self.latched_gesture = \\"WAVE\\"\\n                self._reset_hold()\\n                return \\"WAVE\\"\\n            return None\\n\\n\\n        if gesture == \\"FIST\\": ##0519_v4 수정부분\\n            hold_time = COMMAND_HOLD_SECONDS * (4 if self.point_mode else 1)\\n            if not self._hold_ready_with(\\"FIST\\", hold_time):\\n                return None\\n            self.sleep()\\n            self._reset_hold()\\n        elif gesture == \\"POINT_MODE\\":\\n            if self.latched_gesture == \\"POINT_MODE\\":\\n                return gesture\\n            if not self._hold_ready(\\"POINT_MODE\\"):\\n                return None\\n            self.enter_point_mode()\\n            self._reset_hold()\\n        elif gesture == \\"POINT\\":\\n            self._reset_hold()\\n            if not self.point_mode:\\n                emit(\\"point_blocked\\", reason=\\"point_mode_required\\")\\n                return None\\n            self.update_point_target(frame, results.multi_hand_landmarks[0])\\n        elif gesture in (\\"THUMBS_UP\\", \\"THUMBS_DOWN\\"):    #0520_v2m   \\n            self._reset_hold()\\n            if not self.point_mode:              # ← 추가: 포인트모드 중엔 밝기 변경 무시\\n                self.apply_brightness_gesture(gesture)\\n        elif gesture == \\"MODE_SWITCH\\":\\n            if self.latched_gesture == \\"MODE_SWITCH\\":\\n                return gesture\\n            if not self._hold_ready(\\"MODE_SWITCH\\"):\\n                return None\\n            self.mode = \\"Mood\\" if self.mode == \\"Spot\\" else \\"Spot\\"\\n            self.save_state()\\n            emit(\\"mode\\", mode=self.mode)\\n            self._reset_hold()\\n        else:\\n            self._reset_hold()\\n        self.latched_gesture = gesture\\n        return gesture\\n\\n    def _hold_ready_with(self, gesture, seconds): ##0519_v4 추가부분\\n        now = time.time()\\n        if self.hold_gesture != gesture:\\n            self.hold_gesture = gesture\\n            self.hold_start_time = now\\n            return False\\n        return now - self.hold_start_time >= seconds\\n\\n    def state_payload(self, fps, gesture, hand_detected, bbox_px, wave_active):\\n        active_remaining = max(0.0, self.active_until - time.time()) if not self.standby else 0.0\\n        return {\\n            \\"standby\\": self.standby,\\n            \\"power\\": self.power,\\n            \\"brightness\\": self.brightness,\\n            \\"mode\\": self.mode,\\n            \\"point_mode\\": self.point_mode,\\n            \\"point_status\\": self.point_status,\\n            \\"yolo_status\\": self.yolo_status,\\n            \\"keep_awake\\": KEEP_AWAKE,\\n            \\"active_timeout_seconds\\": ACTIVE_TIMEOUT_SECONDS,\\n            \\"active_remaining_seconds\\": round(active_remaining, 1),\\n            \\"point_target\\": self.point_target,\\n            \\"point_display_target\\": self.point_display_target,\\n            \\"point_stable_ratio\\": round(self.point_stable_ratio, 2),\\n            \\"point_std_px\\": round(self.point_std_px, 1),\\n            \\"pan_deg\\": round(self.pan_deg, 2),\\n            \\"tilt_deg\\": round(self.tilt_deg, 2),\\n            \\"preview_pan_deg\\": round(self.preview_pan_deg, 2),\\n            \\"preview_tilt_deg\\": round(self.preview_tilt_deg, 2),\\n            \\"last_delta_pan_deg\\": round(self.last_delta_pan_deg, 2),\\n            \\"last_delta_tilt_deg\\": round(self.last_delta_tilt_deg, 2),\\n            \\"last_brightness_gesture\\": self.last_brightness_gesture,\\n            \\"servo_pan_deg\\": round(self.servo_pan_deg, 2),  # 0521_v2m (디버깅용)\\n            \\"servo_tilt_deg\\": round(self.servo_tilt_deg, 2),\\n            \\"gesture\\": gesture,\\n            \\"hand_detected\\": hand_detected,\\n            \\"hand_bbox_width_px\\": bbox_px,\\n            \\"wave_active\\": wave_active,\\n            \\"fps\\": round(fps, 1),\\n        }\\n\\n"}, {"id": "file_1779400000015_015", "name": "vision/pi_runtime_events.py", "phase": "비전 (vision)", "description": "JSON 이벤트/STATE 출력", "content": "import json\\nimport time\\n\\n\\ndef emit(kind, **data):\\n    data[\\"type\\"] = kind\\n    data[\\"ts\\"] = round(time.time(), 3)\\n    print(\\"EVENT \\" + json.dumps(data, ensure_ascii=False), flush=True)\\n\\n\\ndef emit_state(payload):\\n    print(\\"STATE \\" + json.dumps(payload, ensure_ascii=False), flush=True)\\n"}, {"id": "file_1779400000016_016", "name": "vision/pi_runtime_motion.py", "phase": "비전 (vision)", "description": "모션/wave 후보 감지", "content": "import cv2\\n\\nfrom pi_runtime_config import FRAME_W\\n\\n\\ndef hand_bbox_width_px(results):\\n    if not results or not getattr(results, \\"multi_hand_landmarks\\", None):\\n        return 0\\n    xs = [lm.x for lm in results.multi_hand_landmarks[0].landmark]\\n    return int((max(xs) - min(xs)) * FRAME_W)\\n\\n\\ndef detect_wave_motion(prev_gray, gray, history):\\n    if prev_gray is None:\\n        return False, 0.0, 0\\n\\n    diff = cv2.absdiff(prev_gray, gray)\\n    thresh = cv2.threshold(diff, 25, 255, cv2.THRESH_BINARY)[1]\\n    thresh = cv2.dilate(thresh, None, iterations=2)\\n    motion_score = cv2.countNonZero(thresh)\\n    if motion_score <= int(gray.shape[0] * gray.shape[1] * 0.0015):\\n        return False, 0.0, 0\\n\\n    moments = cv2.moments(thresh)\\n    if moments[\\"m00\\"] <= 0:\\n        return False, 0.0, 0\\n\\n    history.append(int(moments[\\"m10\\"] / moments[\\"m00\\"]))\\n    if len(history) < 4:\\n        return False, 0.0, 0\\n\\n    span = max(history) - min(history)\\n    steps = [history[i] - history[i - 1] for i in range(1, len(history))]\\n    signs = [1 if step > 1 else -1 for step in steps if abs(step) > 1]\\n    turns = sum(1 for i in range(1, len(signs)) if signs[i] != signs[i - 1])\\n    threshold = max(5, int(gray.shape[1] * 0.05))\\n    return span > threshold and turns >= 2, float(span), turns\\n"}, {"id": "file_1779400000017_017", "name": "vision/pointing_target.py", "phase": "비전 (vision)", "description": "손가락 ray + MiDaS depth → 가리키는 지점", "content": "import math\\nimport os\\nimport time\\nfrom collections import deque\\n\\nimport cv2\\nimport numpy as np\\n\\n\\nHAND_WRIST_TO_MIDDLE_MCP_M = 0.10\\nRAY_STEP_PX = 4\\nRAY_MAX_STEPS = 300\\nDEPTH_HIT_THRESHOLD = 0.12\\nDEPTH_UPDATE_INTERVAL = 4\\nSTABLE_SECONDS = 3.0\\nSTABLE_STD_PX = 55.0\\nJITTER_RESET_PX = 140.0\\nBUFFER_MAXLEN = 50\\nEMA_ALPHA = 0.25\\n\\n\\nclass DepthEstimator:\\n    def __init__(self):\\n        import torch\\n\\n        self.torch = torch\\n        self.device = torch.device(\\"cuda\\" if torch.cuda.is_available() else \\"cpu\\")\\n        print(\\"[Pointing] MiDaS loading... first run can take a while\\")\\n        self.model = torch.hub.load(\\"intel-isl/MiDaS\\", \\"MiDaS_small\\", trust_repo=True)\\n        self.model.to(self.device)\\n        self.model.eval()\\n        transforms = torch.hub.load(\\"intel-isl/MiDaS\\", \\"transforms\\", trust_repo=True)\\n        self.transform = transforms.small_transform\\n        self.depth_scale = 1.0\\n        self.is_calibrated = False\\n        print(f\\"[Pointing] MiDaS loaded ({self.device})\\")\\n\\n    def estimate(self, frame_bgr):\\n        img_rgb = cv2.cvtColor(frame_bgr, cv2.COLOR_BGR2RGB)\\n        input_tensor = self.transform(img_rgb).to(self.device)\\n\\n        with self.torch.no_grad():\\n            prediction = self.model(input_tensor)\\n            prediction = self.torch.nn.functional.interpolate(\\n                prediction.unsqueeze(1),\\n                size=(frame_bgr.shape[0], frame_bgr.shape[1]),\\n                mode=\\"bicubic\\",\\n                align_corners=False,\\n            ).squeeze()\\n\\n        depth_map = prediction.cpu().numpy()\\n        d_min, d_max = depth_map.min(), depth_map.max()\\n        if d_max - d_min > 1e-6:\\n            depth_map = (depth_map - d_min) / (d_max - d_min)\\n        return depth_map.astype(np.float32)\\n\\n    def calibrate(self, depth_map, wrist_px, middle_mcp_px, cam_fx):\\n        wx, wy = wrist_px\\n        mx, my = middle_mcp_px\\n        px_dist = math.hypot(mx - wx, my - wy)\\n        if px_dist < 20:\\n            return False\\n\\n        estimated_depth_m = HAND_WRIST_TO_MIDDLE_MCP_M * cam_fx / px_dist\\n        h, w = depth_map.shape\\n        wx_c = int(np.clip(wx, 5, w - 5))\\n        wy_c = int(np.clip(wy, 5, h - 5))\\n        midas_val = float(np.mean(depth_map[wy_c - 5:wy_c + 5, wx_c - 5:wx_c + 5]))\\n        if midas_val < 0.01:\\n            return False\\n\\n        self.depth_scale = estimated_depth_m * midas_val\\n        self.is_calibrated = True\\n        print(\\n            f\\"[Pointing] calibrated scale={self.depth_scale:.4f} \\"\\n            f\\"hand_depth={estimated_depth_m:.2f}m midas={midas_val:.3f}\\"\\n        )\\n        return True\\n\\n    def midas_to_meters(self, midas_val):\\n        if midas_val < 0.001:\\n            return 99.0\\n        return self.depth_scale / midas_val\\n\\n\\nclass MotorAngleTracker: #0520_v2m\\n    def __init__(self, cam_fx, cam_fy, cx, cy):\\n        self.fx = cam_fx\\n        self.fy = cam_fy\\n        self.cx = cx\\n        self.cy = cy\\n        self.buf_x = deque(maxlen=BUFFER_MAXLEN)\\n        self.buf_y = deque(maxlen=BUFFER_MAXLEN)\\n        self.stable_start = None\\n        self.confirmed_target = None\\n        self.confirmed_angles = None\\n        self.ema_x = None\\n        self.ema_y = None\\n        self.grace_until = 0.0\\n        self.last_pointing_time = 0.0\\n        self.pointing_grace_seconds = float(os.environ.get(\\"PI_POINTING_GRACE_SECONDS\\", \\"0.35\\"))\\n\\n    def update(self, raw, is_pointing):\\n        result = {\\n            \\"display_target\\": None,\\n            \\"confirmed\\": self.confirmed_target,\\n            \\"pan_deg\\": self.confirmed_angles[0] if self.confirmed_angles else None,\\n            \\"tilt_deg\\": self.confirmed_angles[1] if self.confirmed_angles else None,\\n            \\"stable_ratio\\": 0.0,\\n            \\"std_px\\": 0.0,\\n            \\"stable_rejected\\": False,\\n        }\\n\\n        if self.confirmed_target is not None:\\n            result[\\"display_target\\"] = self.confirmed_target\\n            result[\\"stable_ratio\\"] = 1.0\\n            return result\\n\\n        # 포인트모드 진입 직후 유예시간 — 피스→포인트 전환 중 잘못된 데이터 방지\\n        if time.time() < self.grace_until: #0520_v2m\\n            return result\\n\\n        now = time.time()\\n\\n        if is_pointing and raw is not None:\\n            self.last_pointing_time = now\\n        else:\\n            if now - self.last_pointing_time <= self.pointing_grace_seconds:\\n                result[\\"display_target\\"] = (\\n                    (int(self.ema_x), int(self.ema_y))\\n                    if self.ema_x is not None and self.ema_y is not None\\n                    else None\\n                )\\n                if self.stable_start is not None:\\n                    elapsed = now - self.stable_start\\n                    result[\\"stable_ratio\\"] = min(elapsed / STABLE_SECONDS, 1.0)\\n                return result\\n\\n            self._reset_buffer()\\n            return result\\n\\n        rx, ry = raw\\n        self.buf_x.append(rx)\\n        self.buf_y.append(ry)\\n\\n        if self.ema_x is None:\\n            self.ema_x, self.ema_y = float(rx), float(ry)\\n        else:\\n            self.ema_x = EMA_ALPHA * rx + (1 - EMA_ALPHA) * self.ema_x\\n            self.ema_y = EMA_ALPHA * ry + (1 - EMA_ALPHA) * self.ema_y\\n        result[\\"display_target\\"] = (int(self.ema_x), int(self.ema_y))\\n\\n        if self.stable_start is None:\\n            self.stable_start = time.time()\\n\\n        elapsed = time.time() - self.stable_start\\n        result[\\"stable_ratio\\"] = min(elapsed / STABLE_SECONDS, 1.0)\\n\\n        if len(self.buf_x) >= 5:\\n            result[\\"std_px\\"] = float(np.hypot(np.std(self.buf_x), np.std(self.buf_y)))\\n            if result[\\"std_px\\"] > JITTER_RESET_PX:\\n                print(f\\"[Pointing] too much jitter, reset buffer std={result['std_px']:.1f}px\\")\\n                self._reset_buffer()\\n                result[\\"stable_ratio\\"] = 0.0\\n                result[\\"stable_rejected\\"] = True\\n                return result\\n\\n        if elapsed >= STABLE_SECONDS:\\n            if result[\\"std_px\\"] > STABLE_STD_PX: #0520_v2m\\n                print(f\\"[Pointing] not stable enough, retry std={result['std_px']:.1f}px\\")\\n                self._reset_buffer()          # ← 버퍼도 비워서 과거 흔들림 데이터 제거\\n                result[\\"stable_ratio\\"] = 0.0\\n                result[\\"stable_rejected\\"] = True\\n                return result\\n\\n            tx = int(np.mean(self.buf_x))\\n            ty = int(np.mean(self.buf_y))\\n            pan, tilt = self._to_angles(tx, ty)\\n            self.confirmed_target = (tx, ty)\\n            self.confirmed_angles = (pan, tilt)\\n            result.update({\\n                \\"confirmed\\": self.confirmed_target,\\n                \\"pan_deg\\": pan,\\n                \\"tilt_deg\\": tilt,\\n                \\"stable_ratio\\": 1.0,\\n            })\\n            print(\\n                f\\"[Pointing] target confirmed pixel=({tx},{ty}) \\"\\n                f\\"pan={pan:+.2f} tilt={tilt:+.2f} std={result['std_px']:.1f}px\\"\\n            )\\n            self._reset_buffer()\\n\\n        return result\\n\\n    def _to_angles(self, tx, ty):\\n        pan_deg = math.degrees(math.atan((tx - self.cx) / self.fx))\\n        tilt_deg = math.degrees(math.atan((ty - self.cy) / self.fy))\\n        return pan_deg, tilt_deg\\n\\n    def _reset_buffer(self):\\n        self.buf_x.clear()\\n        self.buf_y.clear()\\n        self.stable_start = None\\n        self.ema_x = None\\n        self.ema_y = None\\n\\n    def reset(self, clear_confirmed=False): #0520_v2m\\n        self._reset_buffer()\\n        if clear_confirmed:\\n            self.confirmed_target = None\\n            self.confirmed_angles = None\\n            self.grace_until = time.time() + 1.0   # ← 추가: 1초간 데이터 무시\\n\\n\\nclass PointingTargetEstimator:\\n    WRIST = 0\\n    INDEX_MCP = 5\\n    INDEX_TIP = 8\\n    MIDDLE_MCP = 9\\n\\n    def __init__(self, frame_w, frame_h, cam_fx=None, cam_fy=None, cx=None, cy=None):\\n        self.frame_w = frame_w\\n        self.frame_h = frame_h\\n        # 캘리브레이션 값이 제공되면 사용, 아니면 0.7*W 추정값\\n        self.cam_fx = float(cam_fx) if cam_fx is not None else frame_w * 0.7\\n        self.cam_fy = float(cam_fy) if cam_fy is not None else self.cam_fx\\n        self.cx = float(cx) if cx is not None else frame_w / 2.0\\n        self.cy = float(cy) if cy is not None else frame_h / 2.0\\n        self.depth_est = None\\n        self.depth_error = None\\n        try:\\n            self.depth_est = DepthEstimator()\\n        except ModuleNotFoundError as e:\\n            self.depth_error = str(e)\\n            print(f\\"[Pointing] MiDaS disabled, using 2D ray fallback: {e}\\")\\n        except Exception as e:\\n            self.depth_error = str(e)\\n            print(f\\"[Pointing] MiDaS disabled, using 2D ray fallback: {e}\\")\\n        self.tracker = MotorAngleTracker(self.cam_fx, self.cam_fy, self.cx, self.cy)\\n        self.depth_map = None\\n        self.frame_count = 0\\n\\n    def update(self, frame_bgr, hand_landmarks):\\n        self.frame_count += 1\\n        landmarks = hand_landmarks.landmark\\n        points = self._key_points(landmarks)\\n\\n        if self.depth_est is None:\\n            raw_target = self._project_to_screen_edge(points[\\"index_mcp\\"], points[\\"index_tip\\"])\\n            result = self.tracker.update(raw_target, True)\\n            result[\\"raw_target\\"] = raw_target\\n            result[\\"calibrated\\"] = False\\n            result[\\"depth_available\\"] = False\\n            result[\\"used_depth_hit\\"] = False\\n            result[\\"hit_method\\"] = \\"2d_fallback_no_depth\\"\\n            result[\\"depth_error\\"] = self.depth_error\\n            return result\\n\\n        if self.depth_map is None or self.frame_count % DEPTH_UPDATE_INTERVAL == 0:\\n            self.depth_map = self.depth_est.estimate(frame_bgr)\\n\\n        if not self.depth_est.is_calibrated:\\n            self.depth_est.calibrate(\\n                self.depth_map,\\n                points[\\"wrist\\"],\\n                points[\\"middle_mcp\\"],\\n                self.cam_fx,\\n            )\\n\\n        raw_target = self._march(points[\\"index_mcp\\"], points[\\"index_tip\\"])\\n        used_depth_hit = raw_target is not None\\n\\n        # ray가 표면을 못 찾았을 때 2D fallback으로 임시 타겟 제공\\n        if raw_target is None:\\n            raw_target = self._project_to_screen_edge(points[\\"index_mcp\\"], points[\\"index_tip\\"])\\n\\n        result = self.tracker.update(raw_target, True)\\n        result[\\"raw_target\\"] = raw_target\\n        result[\\"calibrated\\"] = self.depth_est.is_calibrated\\n        result[\\"depth_available\\"] = True\\n        result[\\"used_depth_hit\\"] = used_depth_hit\\n        result[\\"hit_method\\"] = \\"depth_march\\" if used_depth_hit else \\"2d_fallback_after_depth\\"\\n        result[\\"depth_error\\"] = None\\n        return result\\n\\n    def reset(self, clear_confirmed=False):\\n        self.tracker.reset(clear_confirmed=clear_confirmed)\\n\\n    def _key_points(self, landmarks):\\n        def to_px(lm):\\n            return (\\n                int(np.clip(lm.x, 0.0, 1.0) * self.frame_w),\\n                int(np.clip(lm.y, 0.0, 1.0) * self.frame_h),\\n            )\\n\\n        return {\\n            \\"wrist\\": to_px(landmarks[self.WRIST]),\\n            \\"index_mcp\\": to_px(landmarks[self.INDEX_MCP]),\\n            \\"index_tip\\": to_px(landmarks[self.INDEX_TIP]),\\n            \\"middle_mcp\\": to_px(landmarks[self.MIDDLE_MCP]),\\n        }\\n\\n    def _project_to_screen_edge(self, mcp_px, tip_px):\\n        mx, my = mcp_px\\n        tx, ty = tip_px\\n        dx = tx - mx\\n        dy = ty - my\\n        dist = math.hypot(dx, dy)\\n        if dist < 1e-3:\\n            return None\\n\\n        ux = dx / dist\\n        uy = dy / dist\\n        start = dist + 10\\n        last = None\\n        max_steps = int(max(self.frame_w, self.frame_h) / RAY_STEP_PX) + 50\\n        for step in range(max_steps):\\n            t = start + step * RAY_STEP_PX\\n            cx = int(mx + ux * t)\\n            cy = int(my + uy * t)\\n            if cx < 0 or cx >= self.frame_w or cy < 0 or cy >= self.frame_h:\\n                return last\\n            last = (cx, cy)\\n\\n        return last\\n\\n    def _march(self, mcp_px, tip_px):\\n        if self.depth_map is None:\\n            return None\\n\\n        mx, my = mcp_px\\n        tx, ty = tip_px\\n        dx = tx - mx\\n        dy = ty - my\\n        dist = math.hypot(dx, dy)\\n        if dist < 1e-3:\\n            return None\\n\\n        ux = dx / dist\\n        uy = dy / dist\\n\\n        mx_c = int(np.clip(mx, 0, self.frame_w - 1))\\n        my_c = int(np.clip(my, 0, self.frame_h - 1))\\n        start_midas = float(self.depth_map[my_c, mx_c])\\n        start_depth_m = self.depth_est.midas_to_meters(start_midas)\\n        start_offset = dist + 10\\n\\n        for step in range(RAY_MAX_STEPS):\\n            t = start_offset + step * RAY_STEP_PX\\n            cx = int(mx + ux * t)\\n            cy = int(my + uy * t)\\n            if cx < 0 or cx >= self.frame_w or cy < 0 or cy >= self.frame_h:\\n                return None\\n\\n            surface_midas = float(self.depth_map[cy, cx])\\n            surface_depth_m = self.depth_est.midas_to_meters(surface_midas)\\n            ray_depth_m = start_depth_m * (t / dist)\\n            if ray_depth_m >= surface_depth_m * (1.0 - DEPTH_HIT_THRESHOLD):\\n                return (cx, cy)\\n\\n        return None\\n"}, {"id": "file_1779400000018_018", "name": "vision/raspberry_pi_runtime.py", "phase": "비전 (vision)", "description": "메인 루프 (카메라→MediaPipe→제스처)", "content": "import atexit\\nimport logging\\nimport sys\\nimport shutil\\nimport subprocess\\nimport time\\nfrom collections import deque\\n\\nimport cv2\\nimport mediapipe as mp\\nimport numpy as np\\n\\nfrom pi_runtime_config import (\\n    CAM_INDEX,\\n    CAMERA_BACKEND,\\n    DEBUG_OUTPUT,\\n    ENABLE_GESTURE_ZONE_ROI,\\n    ENABLE_HAND_SIZE_GATING,\\n    ENABLE_MOTION_ROI,\\n    ENABLE_YOLO,\\n    FRAME_H,\\n    FRAME_W,\\n    GESTURE_ZONE,\\n    MIN_FINE_GESTURE_HAND_BBOX_WIDTH_PX,\\n    MIN_MOTION_ROI_SIZE,\\n    MIRROR,\\n    MOTION_ROI_PADDING_RATIO,\\n    MP_DET_CONF,\\n    MP_TRK_CONF,\\n    MP_MODEL_COMPLEXITY,\\n    ACTIVE_INFERENCE_FPS,\\n    STANDBY_INFERENCE_FPS,\\n    POINT_INFERENCE_FPS,\\n    TRACK_ROI_SCALE,\\n    TRACK_ROI_PADDING_RATIO,\\n    TRACK_ROI_TTL,\\n    FULL_FRAME_REACQUIRE_INTERVAL,\\n    YOLO_AFTER_MISSES,\\n    YOLO_REACQUIRE_INTERVAL,\\n    ROI_FALLBACK_AFTER_MISSES,\\n    ROI_FALLBACK_INTERVAL,\\n    ROI_SCALE,\\n    SHOW_PREVIEW,\\n    STATUS_INTERVAL,\\n    TARGET_FPS,\\n    WAVE_CANDIDATE_FRAMES,\\n    WAVE_CONFIRM_MIN_HITS,\\n    WAVE_CONFIRM_WINDOW_SECONDS,\\n    WAVE_MOTION_SPAN_RATIO,\\n    YOLO_CONFIDENCE,\\n    YOLO_ROI_PADDING_RATIO,\\n    YOLO_ROI_SCALE,\\n)\\nfrom pi_runtime_config import PROJECT_ROOT\\n\\nif str(PROJECT_ROOT) not in sys.path:\\n    sys.path.insert(0, str(PROJECT_ROOT))\\n\\nfrom pi_runtime_controller import PiSmartLightController\\nfrom pi_runtime_events import emit_state\\nfrom src.core.led_controller import LEDController\\n\\n\\nclass OpenCVCamera:\\n    def __init__(self, cap, name):\\n        self.cap = cap\\n        self.name = name\\n\\n    def read(self):\\n        return self.cap.read()\\n\\n    def release(self):\\n        self.cap.release()\\n\\n\\nclass Picamera2Camera:\\n    def __init__(self, picam2):\\n        self.picam2 = picam2\\n        self.name = \\"picamera2\\"\\n\\n    def read(self):\\n        try:\\n            frame = self.picam2.capture_array()\\n        except Exception as e:\\n            print(f\\"[PI] picamera2 capture failed: {e}\\", flush=True)\\n            return False, None\\n        if frame is None:\\n            return False, None\\n        if len(frame.shape) == 3 and frame.shape[2] == 3:\\n            frame = cv2.cvtColor(frame, cv2.COLOR_RGB2BGR)\\n        elif len(frame.shape) == 3 and frame.shape[2] == 4:\\n            frame = cv2.cvtColor(frame, cv2.COLOR_RGBA2BGR)\\n        return True, frame\\n\\n    def release(self):\\n        self.picam2.stop()\\n\\n\\nclass RpicamVidCamera:\\n    def __init__(self, proc, command_name):\\n        self.proc = proc\\n        self.command_name = command_name\\n        self.name = command_name\\n        self.buffer = bytearray()\\n\\n    def read(self):\\n        deadline = time.time() + 2.0\\n        while time.time() < deadline:\\n            start = self.buffer.find(b\\"\\\\xff\\\\xd8\\")\\n            end = self.buffer.find(b\\"\\\\xff\\\\xd9\\", start + 2) if start >= 0 else -1\\n            if start >= 0 and end >= 0:\\n                jpeg = bytes(self.buffer[start:end + 2])\\n                del self.buffer[:end + 2]\\n                frame = cv2.imdecode(np.frombuffer(jpeg, dtype=np.uint8), cv2.IMREAD_COLOR)\\n                if frame is not None:\\n                    return True, frame\\n\\n            chunk = self.proc.stdout.read(4096)\\n            if not chunk:\\n                return False, None\\n            self.buffer.extend(chunk)\\n            if len(self.buffer) > 5_000_000:\\n                del self.buffer[:-1_000_000]\\n        return False, None\\n\\n    def release(self):\\n        if self.proc.poll() is None:\\n            self.proc.terminate()\\n            try:\\n                self.proc.wait(timeout=2.0)\\n            except subprocess.TimeoutExpired:\\n                self.proc.kill()\\n\\n\\ndef open_camera():\\n    backend = CAMERA_BACKEND\\n    errors = []\\n    if backend not in {\\"auto\\", \\"opencv\\", \\"picamera2\\", \\"rpicam-vid\\", \\"libcamera-vid\\"}:\\n        print(f\\"[PI] unknown PI_CAMERA_BACKEND={backend!r}; using auto\\", flush=True)\\n        backend = \\"auto\\"\\n\\n    if backend in {\\"auto\\", \\"opencv\\"}:\\n        opencv_camera = open_opencv_camera(errors)\\n        if opencv_camera is not None:\\n            return opencv_camera\\n\\n    if backend in {\\"auto\\", \\"picamera2\\"}:\\n        picamera = open_picamera2(errors)\\n        if picamera is not None:\\n            return picamera\\n\\n    if backend in {\\"auto\\", \\"rpicam-vid\\", \\"libcamera-vid\\"}:\\n        rpicam = open_rpicam_vid(errors, backend)\\n        if rpicam is not None:\\n            return rpicam\\n\\n    print(\\"[PI] camera open failed\\", flush=True)\\n    for error in errors:\\n        print(f\\"[PI]   {error}\\", flush=True)\\n    print(\\n        \\"[PI] Try: rpicam-hello --list-cameras, ls -l /dev/video*, \\"\\n        \\"or PI_CAMERA_BACKEND=rpicam-vid python3 src/vision/raspberry_pi_runtime.py\\",\\n        flush=True,\\n    )\\n    raise RuntimeError(\\"No camera backend produced frames\\")\\n\\n\\ndef open_opencv_camera(errors):\\n    if isinstance(CAM_INDEX, int):\\n        api_candidates = [\\n            (cv2.CAP_V4L2, \\"opencv_v4l2\\"),\\n            (cv2.CAP_ANY, \\"opencv_any\\"),\\n        ]\\n    else:\\n        api_candidates = [(cv2.CAP_ANY, \\"opencv_any\\")]\\n\\n    for api, name in api_candidates:\\n        cap = cv2.VideoCapture(CAM_INDEX, api)\\n        configure_opencv_capture(cap)\\n        ok, frame = read_warmup_frame(cap)\\n        if cap.isOpened() and ok and frame is not None:\\n            print(f\\"[PI] camera opened with {name} source={CAM_INDEX}\\", flush=True)\\n            return OpenCVCamera(cap, name)\\n        errors.append(f\\"{name} source={CAM_INDEX}: opened={cap.isOpened()} first_frame={ok}\\")\\n        cap.release()\\n    return None\\n\\n\\ndef configure_opencv_capture(cap):\\n    cap.set(cv2.CAP_PROP_FRAME_WIDTH, FRAME_W)\\n    cap.set(cv2.CAP_PROP_FRAME_HEIGHT, FRAME_H)\\n    cap.set(cv2.CAP_PROP_FPS, TARGET_FPS)\\n    cap.set(cv2.CAP_PROP_BUFFERSIZE, 1)\\n\\n\\ndef read_warmup_frame(cap):\\n    ok = False\\n    frame = None\\n    for _ in range(10):\\n        ok, frame = cap.read()\\n        if ok and frame is not None:\\n            return ok, frame\\n        time.sleep(0.05)\\n    return ok, frame\\n\\n\\ndef open_picamera2(errors):\\n    try:\\n        from picamera2 import Picamera2\\n    except Exception as e:\\n        dist_packages = \\"/usr/lib/python3/dist-packages\\"\\n        if dist_packages not in sys.path:\\n            sys.path.append(dist_packages)\\n            try:\\n                from picamera2 import Picamera2\\n            except Exception as retry_error:\\n                errors.append(f\\"picamera2 import failed: {e}; retry failed: {retry_error}\\")\\n                return None\\n        else:\\n            errors.append(f\\"picamera2 import failed: {e}\\")\\n            return None\\n\\n    picam2 = None\\n    try:\\n        picam2 = Picamera2()\\n        config = picam2.create_video_configuration(\\n            main={\\"size\\": (FRAME_W, FRAME_H), \\"format\\": \\"RGB888\\"},\\n            controls={\\"FrameRate\\": TARGET_FPS},\\n        )\\n        picam2.configure(config)\\n        picam2.start()\\n        time.sleep(0.3)\\n        camera = Picamera2Camera(picam2)\\n        ok, frame = camera.read()\\n        if ok and frame is not None:\\n            print(f\\"[PI] camera opened with picamera2 source={CAM_INDEX}\\", flush=True)\\n            return camera\\n        errors.append(\\"picamera2: first_frame=False\\")\\n    except Exception as e:\\n        errors.append(f\\"picamera2 open failed: {e}\\")\\n\\n    if picam2 is not None:\\n        try:\\n            picam2.stop()\\n        except Exception:\\n            pass\\n    return None\\n\\n\\ndef open_rpicam_vid(errors, backend):\\n    command_names = []\\n    if backend == \\"libcamera-vid\\":\\n        command_names.append(\\"libcamera-vid\\")\\n    else:\\n        command_names.append(\\"rpicam-vid\\")\\n    command_names.extend(name for name in (\\"rpicam-vid\\", \\"libcamera-vid\\") if name not in command_names)\\n\\n    for command_name in command_names:\\n        command_path = shutil.which(command_name)\\n        if command_path is None:\\n            errors.append(f\\"{command_name}: command not found\\")\\n            continue\\n\\n        cmd = [\\n            command_path,\\n            \\"--timeout\\",\\n            \\"0\\",\\n            \\"--nopreview\\",\\n            \\"--codec\\",\\n            \\"mjpeg\\",\\n            \\"--width\\",\\n            str(FRAME_W),\\n            \\"--height\\",\\n            str(FRAME_H),\\n            \\"--framerate\\",\\n            str(TARGET_FPS),\\n            \\"--output\\",\\n            \\"-\\",\\n        ]\\n        try:\\n            proc = subprocess.Popen(\\n                cmd,\\n                stdout=subprocess.PIPE,\\n                stderr=subprocess.DEVNULL,\\n                bufsize=0,\\n            )\\n        except Exception as e:\\n            errors.append(f\\"{command_name} start failed: {e}\\")\\n            continue\\n\\n        camera = RpicamVidCamera(proc, command_name)\\n        ok, frame = camera.read()\\n        if ok and frame is not None:\\n            print(f\\"[PI] camera opened with {command_name} mjpeg pipe\\", flush=True)\\n            return camera\\n\\n        return_code = proc.poll()\\n        camera.release()\\n        errors.append(f\\"{command_name}: first_frame=False returncode={return_code}\\")\\n\\n    return None\\n\\n\\ndef has_hand(results):\\n    return bool(results and getattr(results, \\"multi_hand_landmarks\\", None))\\n\\n\\ndef clamp_roi_box(box, frame_width, frame_height):\\n    x1, y1, x2, y2 = box\\n    x1 = max(0, min(frame_width - 1, int(x1)))\\n    y1 = max(0, min(frame_height - 1, int(y1)))\\n    x2 = max(x1 + 1, min(frame_width, int(x2)))\\n    y2 = max(y1 + 1, min(frame_height, int(y2)))\\n    return x1, y1, x2, y2\\n\\n\\ndef gesture_zone_box(frame_width, frame_height):\\n    return clamp_roi_box(\\n        (\\n            frame_width * GESTURE_ZONE[\\"x_min_ratio\\"],\\n            frame_height * GESTURE_ZONE[\\"y_min_ratio\\"],\\n            frame_width * GESTURE_ZONE[\\"x_max_ratio\\"],\\n            frame_height * GESTURE_ZONE[\\"y_max_ratio\\"],\\n        ),\\n        frame_width,\\n        frame_height,\\n    )\\n\\n\\ndef motion_roi_box_from_thresh(thresh, frame_width, frame_height):\\n    contours, _ = cv2.findContours(thresh, cv2.RETR_EXTERNAL, cv2.CHAIN_APPROX_SIMPLE)\\n    if not contours:\\n        return None\\n\\n    contour = max(contours, key=cv2.contourArea)\\n    x, y, w, h = cv2.boundingRect(contour)\\n    if w <= 0 or h <= 0:\\n        return None\\n\\n    small_height, small_width = thresh.shape\\n    scale_x = frame_width / max(small_width, 1)\\n    scale_y = frame_height / max(small_height, 1)\\n\\n    x1 = x * scale_x\\n    y1 = y * scale_y\\n    x2 = (x + w) * scale_x\\n    y2 = (y + h) * scale_y\\n\\n    pad = max(x2 - x1, y2 - y1) * MOTION_ROI_PADDING_RATIO\\n    x1 -= pad\\n    y1 -= pad\\n    x2 += pad\\n    y2 += pad\\n\\n    if (x2 - x1) < MIN_MOTION_ROI_SIZE:\\n        center_x = (x1 + x2) / 2\\n        x1 = center_x - MIN_MOTION_ROI_SIZE / 2\\n        x2 = center_x + MIN_MOTION_ROI_SIZE / 2\\n\\n    if (y2 - y1) < MIN_MOTION_ROI_SIZE:\\n        center_y = (y1 + y2) / 2\\n        y1 = center_y - MIN_MOTION_ROI_SIZE / 2\\n        y2 = center_y + MIN_MOTION_ROI_SIZE / 2\\n\\n    return clamp_roi_box((x1, y1, x2, y2), frame_width, frame_height)\\n\\n\\ndef yolo_hand_box_from_motion_roi(controller, frame, motion_roi_box):\\n    return yolo_hand_box_from_box(controller, frame, motion_roi_box)\\n\\n\\ndef yolo_hand_box_from_box(controller, frame, search_box):\\n    if not ENABLE_YOLO or controller.yolo_model is None or search_box is None:\\n        return None\\n\\n    frame_height, frame_width = frame.shape[:2]\\n    x1, y1, x2, y2 = clamp_roi_box(search_box, frame_width, frame_height)\\n    crop = frame[y1:y2, x1:x2]\\n    if crop.size == 0:\\n        return None\\n\\n    try:\\n        detections = controller.yolo_model.predict(crop, conf=YOLO_CONFIDENCE, verbose=False)\\n    except Exception as e:\\n        print(f\\"[WARN] YOLO hand detection failed: {e}\\", flush=True)\\n        return None\\n\\n    best = None\\n    best_conf = -1.0\\n    names = getattr(controller.yolo_model, \\"names\\", {}) or {}\\n\\n    for result in detections:\\n        boxes = getattr(result, \\"boxes\\", None)\\n        if boxes is None:\\n            continue\\n        for box in boxes:\\n            cls_id = int(box.cls[0]) if getattr(box, \\"cls\\", None) is not None else -1\\n            cls_name = str(names.get(cls_id, \\"\\")).lower()\\n            conf = float(box.conf[0]) if getattr(box, \\"conf\\", None) is not None else 0.0\\n            if names and cls_name not in {\\"hand\\", \\"hands\\"}:\\n                continue\\n            if conf > best_conf:\\n                best_conf = conf\\n                best = box.xyxy[0].tolist()\\n\\n    if best is None:\\n        return None\\n\\n    bx1, by1, bx2, by2 = best\\n    bx1 += x1\\n    bx2 += x1\\n    by1 += y1\\n    by2 += y1\\n\\n    pad = max(bx2 - bx1, by2 - by1) * YOLO_ROI_PADDING_RATIO\\n    return clamp_roi_box((bx1 - pad, by1 - pad, bx2 + pad, by2 + pad), frame_width, frame_height)\\n\\ndef process_roi_with_landmark_remap(hands, frame, roi_box, roi_scale):\\n    frame_height, frame_width = frame.shape[:2]\\n    x1, y1, x2, y2 = clamp_roi_box(roi_box, frame_width, frame_height)\\n    roi = frame[y1:y2, x1:x2]\\n    if roi.size == 0:\\n        return None\\n\\n    roi_height, roi_width = roi.shape[:2]\\n    upscaled = cv2.resize(\\n        roi,\\n        (roi_width * roi_scale, roi_height * roi_scale),\\n        interpolation=cv2.INTER_LINEAR,\\n    )\\n    roi_results = hands.process(cv2.cvtColor(upscaled, cv2.COLOR_BGR2RGB))\\n    if not has_hand(roi_results):\\n        return None\\n\\n    for hand_landmarks in roi_results.multi_hand_landmarks:\\n        for landmark in hand_landmarks.landmark:\\n            landmark.x = (x1 + landmark.x * roi_width) / frame_width\\n            landmark.y = (y1 + landmark.y * roi_height) / frame_height\\n    return roi_results\\n\\n\\ndef hand_bbox_width_px(results, frame_width):\\n    if not has_hand(results):\\n        return 0\\n    xs = [lm.x for lm in results.multi_hand_landmarks[0].landmark]\\n    return int((max(xs) - min(xs)) * frame_width)\\n\\ndef hand_roi_box_from_results(results, frame_width, frame_height, padding_ratio):\\n    if not has_hand(results):\\n        return None\\n\\n    landmarks = results.multi_hand_landmarks[0].landmark\\n    xs = [lm.x for lm in landmarks]\\n    ys = [lm.y for lm in landmarks]\\n\\n    x1 = min(xs) * frame_width\\n    y1 = min(ys) * frame_height\\n    x2 = max(xs) * frame_width\\n    y2 = max(ys) * frame_height\\n\\n    box_w = x2 - x1\\n    box_h = y2 - y1\\n    size = max(box_w, box_h)\\n\\n    if size <= 1:\\n        return None\\n\\n    pad = size * padding_ratio\\n\\n    return clamp_roi_box(\\n        (x1 - pad, y1 - pad, x2 + pad, y2 + pad),\\n        frame_width,\\n        frame_height,\\n    )\\n\\n\\ndef print_status(payload):\\n    mode = \\"STANDBY\\" if payload[\\"standby\\"] else \\"ACTIVE\\"\\n    print(\\n        f\\"[STATUS] {mode} bright={payload['brightness']} \\"\\n        f\\"MODE={payload['mode']} \\"\\n        f\\"gesture={payload['gesture'] or '-'} hand={payload['hand_detected']} \\"\\n        f\\"point_mode={payload['point_mode']} point={payload['point_status']} \\"\\n        f\\"pan={payload['pan_deg']:+.1f} tilt={payload['tilt_deg']:+.1f} \\"\\n        f\\"fps={payload['fps']}\\",\\n        flush=True,\\n    )\\n    if DEBUG_OUTPUT:\\n        emit_state(payload)\\n\\n\\ndef draw_preview_overlay(frame, controller, fps, gesture, hand_detected, bbox, state):\\n    status = \\"STANDBY\\" if controller.standby else \\"ACTIVE\\"\\n    panel_h = 150\\n    panel = frame.copy()\\n    panel[:] = (18, 18, 18)\\n    lines = [\\n        f\\"{status} fps:{fps:.1f} hand:{hand_detected} bbox:{bbox}px proc:{state.get('processing_mode')}\\",\\n        f\\"gesture:{gesture or '-'} bright:{controller.brightness} last:{controller.last_brightness_gesture or '-'}\\",\\n        f\\"mode:{controller.mode} point_mode:{controller.point_mode} point:{controller.point_status} yolo:{controller.yolo_status}\\",\\n        f\\"wave:{state.get('wave_active')} span:{state.get('wave_motion_span', 0):.1f} turns:{state.get('wave_motion_turns', 0)} hits:{state.get('wave_open_palm_hits', 0)}/{state.get('wave_confirm_min_hits', 0)}\\",\\n        f\\"pan:{controller.preview_pan_deg:+.1f} tilt:{controller.preview_tilt_deg:+.1f} std:{controller.point_std_px:.0f}px\\",\\n    ]\\n    for i, text in enumerate(lines):\\n        cv2.putText(panel, text, (18, 30 + i * 24), cv2.FONT_HERSHEY_SIMPLEX, 0.55, (0, 255, 0), 2)\\n\\n    show_point_marker = (\\n        controller.point_mode\\n        or controller.point_status in (\\n            \\"tracking\\",\\n            \\"tracking_depth\\",\\n            \\"tracking_depth_fallback\\",\\n            \\"tracking_2d_fallback\\",\\n            \\"locked\\",\\n        )\\n    )\\n    target = (controller.point_target or controller.point_display_target) if show_point_marker else None\\n    if target:\\n        tx, ty = int(target[0]), int(target[1])\\n        locked = controller.point_target is not None\\n        color = (0, 255, 80) if locked else (0, 210, 255)\\n        label = \\"LOCKED\\" if locked else f\\"{int(controller.point_stable_ratio * 100)}%\\"\\n        cv2.circle(frame, (tx, ty), 28, color, 2)\\n        cv2.circle(frame, (tx, ty), 6, color, -1)\\n        cv2.line(frame, (tx - 34, ty), (tx + 34, ty), color, 1)\\n        cv2.line(frame, (tx, ty - 34), (tx, ty + 34), color, 1)\\n        cv2.putText(frame, f\\"POINT {label}\\", (tx + 12, ty - 12), cv2.FONT_HERSHEY_SIMPLEX, 0.55, color, 2)\\n    return cv2.vconcat([panel[:panel_h, :], frame])\\n\\n\\ndef dispatch_hardware(led, controller, gesture, hw_state):\\n    # 서보 제어는 controller가 담당. dispatch는 LED + WAVE 시 서보 재기동만 처리.\\n    # POINT 잠금 전환 순간 1회만 LED 발화 (서보는 controller.update_point_target에서 이미 처리)\\n    if controller.point_status == \\"locked\\" and hw_state[\\"point_status\\"] != \\"locked\\":\\n        led.spot_on(controller.brightness)\\n\\n    if gesture == \\"WAVE\\":\\n        # 서보는 controller.wake()에서 이미 재기동 → LED만 켬\\n        if controller.mode == \\"Spot\\":\\n            led.spot_on(controller.brightness)\\n        else:\\n            led.mood_on(controller.brightness)\\n    elif gesture == \\"FIST\\":\\n        # controller.sleep()이 이미 servo.shutdown() 호출 (서보는 마지막 위치 유지)\\n        led.all_off()\\n    elif gesture in (\\"THUMBS_UP\\", \\"THUMBS_DOWN\\"):\\n        if controller.brightness != hw_state[\\"brightness\\"]:\\n            if controller.mode == \\"Spot\\":\\n                led.spot_set(controller.brightness)\\n            else:\\n                led.mood_set(controller.brightness)\\n    elif gesture == \\"MODE_SWITCH\\":\\n        if controller.mode != hw_state[\\"mode\\"]:\\n            if controller.mode == \\"Spot\\":\\n                led.mood_off()\\n                led.spot_on(controller.brightness)\\n            else:\\n                led.spot_off()\\n                led.mood_on(controller.brightness)\\n\\n    hw_state[\\"point_status\\"] = controller.point_status\\n    hw_state[\\"mode\\"] = controller.mode\\n    hw_state[\\"brightness\\"] = controller.brightness\\n\\n\\ndef main():\\n    log_level = logging.DEBUG if DEBUG_OUTPUT else logging.INFO\\n    logging.basicConfig(level=log_level, format=\\"%(asctime)s [%(levelname)s] %(name)s: %(message)s\\")\\n\\n    print(\\n        f\\"[PI] app.py algorithm runtime cam={CAM_INDEX} backend={CAMERA_BACKEND} \\"\\n        f\\"{FRAME_W}x{FRAME_H}@{TARGET_FPS} mirror={MIRROR}\\",\\n        flush=True,\\n    )\\n    print(\\n        f\\"[PI] output={'debug' if DEBUG_OUTPUT else 'normal'} \\"\\n        \\"(set PI_DEBUG=1 for STATE JSON and candidate logs)\\",\\n        flush=True,\\n    )\\n\\n    controller = PiSmartLightController()\\n    led = LEDController()\\n    hw_state = {\\n        \\"point_status\\": controller.point_status,\\n        \\"mode\\": controller.mode,\\n        \\"brightness\\": controller.brightness,\\n    }\\n    controller.start_preloads()\\n    cap = open_camera()\\n\\n    def _shutdown_hardware():\\n        try:\\n            cap.release()\\n        except Exception:\\n            pass\\n        if controller.servo is not None:\\n            try:\\n                controller.servo.shutdown()\\n            except Exception:\\n                pass\\n        try:\\n            led.shutdown()\\n        except Exception:\\n            pass\\n        if SHOW_PREVIEW:\\n            try:\\n                cv2.destroyAllWindows()\\n            except Exception:\\n                pass\\n\\n    atexit.register(_shutdown_hardware)\\n\\n    mp_hands = mp.solutions.hands\\n    mp_draw = mp.solutions.drawing_utils\\n    prev_gray = None\\n    centroid_history = []\\n    wave_candidate_frames = 0\\n    wave_motion_span = 0.0\\n    wave_motion_turns = 0\\n    wave_shape_hits = deque()\\n    no_motion_since = None\\n    hand_miss_frames = 0\\n    \\n    # New: tracked ROI / YOLO reacquire state\\n    last_hand_roi_box = None\\n    last_hand_roi_time = 0.0\\n    last_full_frame_time = 0.0\\n    last_yolo_time = 0.0\\n    last_inference_time = 0.0\\n    \\n    last_results = None\\n    last_results_time = 0.0\\n    last_hand_detected = False\\n    last_hand_bbox = 0\\n    last_gesture_state = controller.recognizer.extract_full_state(None)\\n    \\n    last_roi_fallback_time = 0.0\\n    skip_counter = 0\\n    fps_times = deque(maxlen=30)\\n    prev_time = time.time()\\n    last_status = 0.0\\n    last_state = {}\\n\\n    with mp_hands.Hands(\\n        static_image_mode=False,\\n        model_complexity=MP_MODEL_COMPLEXITY,\\n        min_detection_confidence=MP_DET_CONF,\\n        min_tracking_confidence=MP_TRK_CONF,\\n        max_num_hands=1,\\n    ) as hands:\\n        while True:\\n            ok, frame = cap.read()\\n            if not ok:\\n                print(\\"[PI] camera read failed\\", flush=True)\\n                time.sleep(0.1)\\n                continue\\n\\n            frame = cv2.resize(frame, (FRAME_W, FRAME_H))\\n            # fisheye 보정을 mirror 이전에 적용 (캘리브레이션이 원본 방향 기준)\\n            if controller.undistorter is not None:\\n                frame = controller.undistorter.undistort(frame)\\n            if MIRROR:\\n                frame = cv2.flip(frame, 1)\\n            clean_frame = frame.copy()\\n\\n            now = time.time()\\n            fps_times.append(now - prev_time)\\n            prev_time = now\\n            fps = 1.0 / (sum(fps_times) / len(fps_times) + 1e-9)\\n\\n            skip_processing = False\\n            if controller.standby:\\n                skip_counter += 1\\n                if skip_counter % 3 != 0:\\n                    skip_processing = True\\n            else:\\n                skip_counter = 0\\n                \\n            gesture = None\\n            results = last_results\\n            results_updated = False\\n            hand_detected = last_hand_detected\\n            hand_bbox = last_hand_bbox\\n\\n            motion_detected = False\\n            motion_score = 0\\n            motion_roi_box = None\\n            processing_mode = \\"skipped_hold\\"\\n            gesture_zone_used = False\\n            yolo_roi_used = False\\n            motion_roi_used = False\\n            roi_box = None\\n            roi_scale = 1\\n            \\n            state = last_gesture_state.copy() if isinstance(last_gesture_state, dict) else {\\n                \\"gesture\\": None,\\n                \\"value\\": None,\\n            }\\n            state[\\"processing_mode\\"] = \\"skipped_hold\\"\\n                \\n            # Limit expensive inference FPS separately from camera FPS.\\n            if not skip_processing:\\n                if controller.point_mode:\\n                    inference_fps_limit = POINT_INFERENCE_FPS\\n                elif controller.standby:\\n                    inference_fps_limit = STANDBY_INFERENCE_FPS\\n                else:\\n                    inference_fps_limit = ACTIVE_INFERENCE_FPS\\n\\n                inference_interval = 1.0 / max(inference_fps_limit, 1.0)\\n                if now - last_inference_time < inference_interval:\\n                    skip_processing = True\\n                else:\\n                    last_inference_time = now\\n\\n            if not skip_processing:\\n                small_frame = cv2.resize(frame, (160, 120))\\n                gray = cv2.cvtColor(small_frame, cv2.COLOR_BGR2GRAY)\\n                gray = cv2.GaussianBlur(gray, (9, 9), 0)\\n\\n                if prev_gray is not None:\\n                    frame_delta = cv2.absdiff(prev_gray, gray)\\n                    thresh = cv2.threshold(frame_delta, 25, 255, cv2.THRESH_BINARY)[1]\\n                    thresh = cv2.dilate(thresh, None, iterations=2)\\n                    motion_score = cv2.countNonZero(thresh)\\n                    min_motion_area = int((gray.shape[1] * gray.shape[0]) * 0.0015)\\n\\n                    if motion_score > min_motion_area:\\n                        motion_detected = True\\n                        no_motion_since = None\\n                        motion_roi_box = motion_roi_box_from_thresh(thresh, frame.shape[1], frame.shape[0])\\n\\n                        moments = cv2.moments(thresh)\\n                        if moments[\\"m00\\"] > 0:\\n                            centroid_history.append(int(moments[\\"m10\\"] / moments[\\"m00\\"]))\\n                            if len(centroid_history) > 15:\\n                                centroid_history.pop(0)\\n\\n                            if len(centroid_history) > 3:\\n                                span = max(centroid_history) - min(centroid_history)\\n                                min_span_threshold = max(4, int(gray.shape[1] * WAVE_MOTION_SPAN_RATIO))\\n                                x_steps = [\\n                                    centroid_history[i] - centroid_history[i - 1]\\n                                    for i in range(1, len(centroid_history))\\n                                ]\\n                                x_signs = [\\n                                    1 if step > 1 else -1\\n                                    for step in x_steps\\n                                    if abs(step) > 1\\n                                ]\\n                                x_turns = sum(\\n                                    1 for i in range(1, len(x_signs)) if x_signs[i] != x_signs[i - 1]\\n                                )\\n\\n                                wave_motion_span = float(span)\\n                                wave_motion_turns = x_turns\\n\\n                                if controller.standby and span > min_span_threshold and x_turns >= 2:\\n                                    if DEBUG_OUTPUT:\\n                                        print(\\n          yolo_search_box = gesture_zone_box(frame_width, frame_height)\\n                        else:\\n                            yolo_search_box = (0, 0, frame_width, frame_height)\\n\\n                        yolo_roi_box = yolo_hand_box_from_box(controller, frame, yolo_search_box)\\n\\n                        if yolo_roi_box is not None:\\n                            yolo_roi_used = True\\n                            roi_box = yolo_roi_box\\n                            roi_scale = YOLO_ROI_SCALE\\n\\n                            roi_results = process_roi_with_landmark_remap(\\n                                hands,\\n                                frame,\\n                                yolo_roi_box,\\n                                YOLO_ROI_SCALE,\\n                            )\\n                            if has_hand(roi_results):\\n                                new_results = roi_results\\n                                processing_mode = \\"yolo_reacquire_roi\\"\\n\\n                    # 4) Full-frame reacquire periodically or when all ROI paths fail.\\n                    if new_results is None:\\n                        processing_mode = \\"full_frame\\"\\n                        new_results = hands.process(cv2.cvtColor(frame, cv2.COLOR_BGR2RGB))\\n                        last_full_frame_time = now_infer\\n\\n                    results = new_results\\n                    results_updated = True\\n\\n                # Update hand state only when we actually ran inference.\\n                if results_updated:\\n                    hand_detected = has_hand(results)\\n\\n                    if hand_detected:\\n                        hand_miss_frames = 0\\n\\n                        updated_roi = hand_roi_box_from_results(\\n                            results,\\n                            frame.shape[1],\\n                            frame.shape[0],\\n                            TRACK_ROI_PADDING_RATIO,\\n                        )\\n                        if updated_roi is not None:\\n                            last_hand_roi_box = updated_roi\\n                            last_hand_roi_time = time.time()\\n                    else:\\n                        hand_miss_frames += 1\\n                        results = None\\n                        hand_detected = False\\n                else:\\n                    # No new inference this frame. Keep previous hand state.\\n                    hand_detected = last_hand_detected\\n                    hand_bbox = last_hand_bbox\\n                    results = last_results\\n\\n                if results_updated:\\n                    hand_bbox = hand_bbox_width_px(results, frame.shape[1])\\n                else:\\n                    hand_bbox = last_hand_bbox\\n\\n                # Save cache for skipped frames.\\n                last_results = results\\n                last_hand_detected = hand_detected\\n                last_hand_bbox = hand_bbox\\n                if results is not None and has_hand(results):\\n                    last_results_time = time.time()\\n\\n                controller.update_activity_timeout(hand_detected)\\n\\n                # if hand_detected and SHOW_PREVIEW and results:\\n                #     mp_draw.draw_landmarks(frame, results.multi_hand_landmarks[0], mp_hands.HAND_CONNECTIONS)\\n\\n                if results_updated:\\n                    state = (\\n                        controller.recognizer.extract_full_state(results)\\n                        if results\\n                        else controller.recognizer.extract_full_state(None)\\n                    )\\n                    last_gesture_state = state.copy()\\n                else:\\n                    state = (\\n                        last_gesture_state.copy()\\n                        if isinstance(last_gesture_state, dict)\\n                        else controller.recognizer.extract_full_state(None)\\n                    )\\n\\n                    # Do not replay m             else:\\n                    wave_shape_hits.clear()\\n                    if state.get(\\"gesture\\") == \\"WAVE\\":\\n                        state[\\"gesture\\"] = None\\n                        state[\\"value\\"] = None\\n                        state[\\"confirmed_gesture\\"] = None\\n\\n                current_gesture = state.get(\\"gesture\\")\\n                if controller.standby and current_gesture in (\\"THUMBS_UP\\", \\"THUMBS_DOWN\\"):\\n                    if DEBUG_OUTPUT:\\n                        print(\\"[THUMBS BLOCKED] standby mode, suppress brightness gesture\\", flush=True)\\n                    state[\\"gesture\\"] = None\\n                    state[\\"value\\"] = None\\n                    current_gesture = None\\n\\n                if not controller.standby and current_gesture == \\"POINT\\" and not controller.point_mode:\\n                    if DEBUG_OUTPUT:\\n                        print(\\"[POINT BLOCKED] POINT ignored because POINT_MODE is not enabled\\", flush=True)\\n                    state[\\"gesture\\"] = None\\n                    state[\\"value\\"] = None\\n                    state[\\"confirmed_gesture\\"] = None\\n                    current_gesture = None\\n\\n                gesture = controller.apply_gesture(current_gesture, results, clean_frame, is_shaking)\\n                dispatch_hardware(led, controller, gesture, hw_state)\\n\\n                state.update(\\n                    {\\n                        \\"python_standby\\": controller.standby,\\n                        \\"point_mode_enabled\\": controller.point_mode,\\n                        \\"keep_awake_for_testing\\": controller.state_payload(fps, gesture, hand_detected, hand_bbox, is_shaking)[\\"keep_awake\\"],\\n                        \\"active_hold_remaining\\": max(0.0, controller.active_until - time.time()) if not controller.standby else 0.0,\\n                        \\"motion_score\\": motion_score,\\n                        \\"wave_motion_active\\": is_shaking,\\n                        \\"wave_motion_span\\": wave_motion_span,\\n                        \\"wave_motion_turns\\": wave_motion_turns,\\n                        \\"wave_open_palm_hits\\": len(wave_shape_hits),\\n                        \\"wave_confirm_min_hits\\": WAVE_CONFIRM_MIN_HITS,\\n                        \\"processing_mode\\": processing_mode,\\n                        \\"hand_detected\\": hand_detected,\\n                        \\"gesture_zone_used\\": gesture_zone_used,\\n                        \\"yolo_roi_used\\": yolo_roi_used,\\n                        \\"yolo_hand_status\\": controller.yolo_status,\\n                        \\"motion_roi_used\\": motion_roi_used,\\n                        \\"roi_box\\": roi_box,\\n                        \\"roi_scale\\": roi_scale,\\n                        \\"hand_bbox_width_px\\": hand_bbox,\\n                        \\"fine_gesture_allowed\\": fine_gesture_allowed,\\n                        \\"tick_gesture_allowed\\": tick_gesture_allowed,\\n                    }\\n                )\\n\\n                last_state = state\\n            else:\\n                controller.update_activity_timeout(False)\\n                last_state = state\\n                \\n            # Draw cached landmarks on every preview frame to reduce flicker.\\n            if SHOW_PREVIEW:\\n                draw_results = results if results is not None else last_results\\n                draw_hand_detected = hand_detected or last_hand_detected\\n\\n                if draw_hand_detected and draw_results and has_hand(draw_results):\\n                    mp_draw.draw_landmarks(\\n                        frame,\\n                        draw_results.multi_hand_landmarks[0],\\n                        mp_hands.HAND_CONNECTIONS,\\n                    )\\n            if now - last_status >= STATUS_INTERVAL:\\n                last_status = now\\n                payload = controller.state_payload(fps, gesture, hand_detected, hand_bbox, last_state.get(\\"wave_motion_active\\", False))\\n                payload.update(\\n                    {\\n                        \\"processing_mode\\": last_state.get(\\"processing_mode\\"),\\n                        \\"motion_score\\": last_state.get(\\"motion_score\\", 0),\\n                        \\"wave_motion_span\\": last_state.get(\\"wave_motion_span\\", 0.0),\\n                        \\"wave_motion_turns\\": last_state.get(\\"wave_motion_turns\\", 0),\\n                        \\"wave_open_palm_hits\\": last_state.get(\\"wave_open_palm_hits\\", 0),\\n                        \\"wave_confirm_min_hits\\": last_state.get(\\"wave_confirm_min_hits\\", WAVE_CONFIRM_MIN_HITS),\\n                        \\"gesture_zone_used\\": last_state.get(\\"gesture_zone_used\\", False),\\n                        \\"yolo_roi_used\\": last_state.get(\\"yolo_roi_used\\", False),\\n                        \\"motion_roi_used\\": last_state.get(\\"motion_roi_used\\", False),\\n                        \\"roi_box\\": last_state.get(\\"roi_box\\"),\\n                        \\"roi_scale\\": last_state.get(\\"roi_scale\\", 1),\\n                    }\\n                )\\n                print_status(payload)\\n\\n            if SHOW_PREVIEW:\\n                preview = draw_preview_overlay(frame, controller, fps, gesture, hand_detected, hand_bbox, last_state)\\n                cv2.imshow(\\"Pi Smart Light Runtime\\", preview)\\n                if cv2.waitKey(1) & 0xFF == ord(\\"q\\"):\\n                    break\\n\\n    # 정상 종료 및 예외 모두 atexit 핸들러(_shutdown_hardware)가 처리\\n\\n\\nif __name__ == \\"__main__\\":\\n    main()\\n\\n\\n\\n"}]`;

// ============ INDEXEDDB ============
const DB_NAME = 'gaegle_code_db';
const STORE = 'files';
let db;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = (e) => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains(STORE)) {
        d.createObjectStore(STORE, { keyPath: 'id' });
      }
    };
    req.onsuccess = (e) => { db = e.target.result; resolve(db); };
    req.onerror = (e) => reject(e);
  });
}

function dbGetAll() {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readonly');
    const req = tx.objectStore(STORE).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = (e) => reject(e);
  });
}

function dbPut(item) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    const req = tx.objectStore(STORE).put(item);
    req.onsuccess = () => resolve();
    req.onerror = (e) => reject(e);
  });
}

function dbDelete(id) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    const req = tx.objectStore(STORE).delete(id);
    req.onsuccess = () => resolve();
    req.onerror = (e) => reject(e);
  });
}

// ============ STATE ============
let files = [];
let currentFileId = null;
let editor = null;
let isDirty = false;
let autoSaveTimer = null;

const PHASE_ORDER = ["공통", "Phase 2", "Phase 3", "Phase 4", "Vision", "통합", "기타"];

// ============ TOAST ============
let toastTimer;
function showToast(msg, duration) {
  duration = duration || 2200;
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), duration);
}

// ============ FILE LIST RENDER ============
function renderFileList() {
  const listEl = document.getElementById('fileList');
  document.getElementById('fileCount').textContent = `${files.length}개 파일`;

  if (files.length === 0) {
    listEl.innerHTML = '<div style="padding: 40px 20px; text-align: center; color: var(--muted-soft); font-size: 13px;">파일이 없어요.<br>"초기 코드 불러오기"를 시도해보세요.</div>';
    return;
  }

  // Phase별 그룹화
  const byPhase = {};
  for (const f of files) {
    const phase = f.phase || "기타";
    if (!byPhase[phase]) byPhase[phase] = [];
    byPhase[phase].push(f);
  }

  let html = '';
  for (const phase of PHASE_ORDER) {
    if (!byPhase[phase]) continue;
    html += `<div class="phase-group"><div class="phase-label">${escapeHtml(phase)}</div>`;
    // 이름순 정렬
    byPhase[phase].sort((a, b) => a.name.localeCompare(b.name));
    for (const f of byPhase[phase]) {
      const active = f.id === currentFileId ? 'active' : '';
      const dirty = (f.id === currentFileId && isDirty) ? 'modified' : '';
      html += `
        <div class="file-item ${active} ${dirty}" data-id="${f.id}" onclick="selectFile('${f.id}')">
          <svg class="file-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
          </svg>
          <div class="file-info">
            <div class="file-name">${escapeHtml(f.name)}</div>
            <div class="file-desc">${escapeHtml(f.description || '')}</div>
          </div>
        </div>
      `;
    }
    html += `</div>`;
  }
  listEl.innerHTML = html;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ============ EDITOR ============
function ensureEditor(initialValue, language) {
  if (editor) {
    return editor;
  }
  const container = document.getElementById('editorContainer');
  // empty-state 제거
  const empty = document.getElementById('emptyState');
  if (empty) empty.remove();

  const textarea = document.createElement('textarea');
  container.appendChild(textarea);
  textarea.value = initialValue || '';

  editor = CodeMirror.fromTextArea(textarea, {
    mode: language === 'python' ? 'python' : 'text/plain',
    theme: 'material-darker',
    lineNumbers: true,
    indentUnit: 4,
    smartIndent: true,
    matchBrackets: true,
    autoCloseBrackets: true,
    lineWrapping: false,
    extraKeys: {
      "Ctrl-S": () => saveCurrentFile(),
      "Cmd-S": () => saveCurrentFile(),
      "Tab": (cm) => {
        if (cm.somethingSelected()) {
          cm.indentSelection("add");
        } else {
          cm.replaceSelection("    ", "end");
        }
      },
    },
  });

  editor.on('change', () => {
    isDirty = true;
    renderFileList();
    // 자동 저장 (1.5초 디바운스)
    clearTimeout(autoSaveTimer);
    autoSaveTimer = setTimeout(() => saveCurrentFile(true), 1500);
  });

  return editor;
}

function selectFile(id) {
  // 현재 파일 자동 저장
  if (currentFileId && isDirty) {
    saveCurrentFile(true);
  }

  const file = files.find(f => f.id === id);
  if (!file) return;

  currentFileId = id;
  isDirty = false;

  // 헤더 업데이트
  document.getElementById('editorHeader').style.display = 'flex';
  document.getElementById('currentFileName').textContent = file.name;
  document.getElementById('currentFilePhase').textContent = file.phase || '기타';

  // 에디터에 내용 로드
  const lang = file.language === 'python' ? 'python' : 'text/plain';
  ensureEditor(file.content, file.language);
  editor.setOption('mode', lang);
  editor.setValue(file.content || '');
  editor.clearHistory();

  renderFileList();
  editor.focus();
}

async function saveCurrentFile(silent) {
  if (!currentFileId || !editor) return;
  const file = files.find(f => f.id === currentFileId);
  if (!file) return;
  file.content = editor.getValue();
  file.updatedAt = Date.now();
  try {
    await dbPut(file);
    isDirty = false;
    renderFileList();
    if (!silent) showToast(`${file.name} 저장됨`);
  } catch (err) {
    showToast('저장 실패');
    console.error(err);
  }
}

// ============ NEW FILE MODAL ============
function openNewFileModal() {
  document.getElementById('newFileName').value = '';
  document.getElementById('newFileDesc').value = '';
  document.getElementById('newFilePhase').value = '공통';
  document.getElementById('newFileModal').classList.add('open');
  setTimeout(() => document.getElementById('newFileName').focus(), 100);
}
function closeNewFileModal() {
  document.getElementById('newFileModal').classList.remove('open');
}

document.getElementById('newFileBtn').addEventListener('click', openNewFileModal);
document.getElementById('newFileModal').addEventListener('click', (e) => {
  if (e.target.id === 'newFileModal') closeNewFileModal();
});

document.getElementById('createFileBtn').addEventListener('click', async () => {
  const name = document.getElementById('newFileName').value.trim();
  const phase = document.getElementById('newFilePhase').value;
  const desc = document.getElementById('newFileDesc').value.trim();
  if (!name) {
    showToast('파일명을 입력하세요');
    return;
  }
  if (files.some(f => f.name === name)) {
    showToast('같은 이름의 파일이 이미 있어요');
    return;
  }
  const ext = name.split('.').pop().toLowerCase();
  const lang = (ext === 'py') ? 'python' : 'text';
  const newFile = {
    id: `file_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
    name,
    phase,
    description: desc,
    content: '',
    language: lang,
    createdAt: Date.now(),
    updatedAt: Date.now(),
  };
  try {
    await dbPut(newFile);
    files.push(newFile);
    closeNewFileModal();
    selectFile(newFile.id);
    showToast(`${name} 생성됨`);
  } catch (err) {
    showToast('생성 실패');
  }
});

  document.getElementById('renameModal').classList.add('open');

document.getElementById('renameBtn').addEventListener('click', openRenameModal);
document.getElementById('renameModal').addEventListener('click', (e) => {
