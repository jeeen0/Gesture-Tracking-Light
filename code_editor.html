<style>
  :root {
    --primary: #0a0a0a;
    --brand-pink: #ff4d8b;
    --brand-teal: #1a3a3a;
    --brand-lavender: #b8a4ed;
    --brand-peach: #ffb084;
    --brand-ochre: #e8b94a;
    --brand-mint: #a4d4c5;
    --brand-coral: #ff6b5a;

    --canvas: #fffaf0;
    --surface-soft: #faf5e8;
    --surface-card: #f5f0e0;
    --surface-strong: #ebe6d6;
    --hairline: #e5e5e5;

    --ink: #0a0a0a;
    --body: #3a3a3a;
    --muted: #6a6a6a;
    --muted-soft: #9a9a9a;
    --on-primary: #ffffff;

    --r-md: 12px;
    --r-lg: 16px;
    --r-xl: 24px;
    --r-pill: 9999px;

    --font-display: 'Recoleta', 'Inter', -apple-system, sans-serif;
    --font-body: 'Inter', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--canvas);
    color: var(--ink);
    font-family: var(--font-body);
    height: 100vh;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* NAV */
  .top-nav {
    height: 64px;
    border-bottom: 1px solid var(--hairline);
    background: var(--canvas);
    flex-shrink: 0;
  }
  .nav-inner {
    max-width: 100%;
    margin: 0 auto;
    padding: 0 24px;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 18px;
    letter-spacing: -0.3px;
    color: var(--ink);
    text-decoration: none;
  }
  .brand-mark {
    width: 28px; height: 28px;
    border-radius: 8px;
    background: var(--brand-ochre);
    position: relative; overflow: hidden;
  }
  .brand-mark::before {
    content: ""; position: absolute;
    width: 15px; height: 15px;
    background: var(--brand-pink);
    border-radius: 50%;
    top: -2px; right: -2px;
  }
  .brand-mark::after {
    content: ""; position: absolute;
    width: 10px; height: 10px;
    background: var(--brand-teal);
    border-radius: 3px;
    bottom: 3px; left: 3px;
    transform: rotate(15deg);
  }

  .nav-links { display: flex; gap: 12px; align-items: center; }
  .nav-link {
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    text-decoration: none;
    padding: 6px 12px;
    border-radius: var(--r-md);
    transition: all 0.15s;
  }
  .nav-link:hover { color: var(--ink); background: var(--surface-card); }
  .nav-link.active { color: var(--ink); background: var(--surface-card); }

  .nav-actions {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .btn {
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 600;
    height: 36px;
    padding: 0 14px;
    border-radius: var(--r-md);
    border: 1px solid transparent;
    cursor: pointer;
    transition: all 0.15s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }
  .btn-primary { background: var(--primary); color: var(--on-primary); }
  .btn-primary:hover { background: #2a2a2a; }
  .btn-secondary {
    background: var(--canvas);
    color: var(--ink);
    border-color: var(--hairline);
  }
  .btn-secondary:hover { border-color: var(--ink); }
  .btn-danger {
    background: transparent;
    color: var(--brand-coral);
  }
  .btn-danger:hover { background: var(--brand-coral); color: #fff; }

  /* LAYOUT */
  .workspace {
    display: grid;
    grid-template-columns: 320px 1fr;
    height: calc(100vh - 64px);
  }

  /* SIDEBAR */
  .sidebar {
    background: var(--surface-soft);
    border-right: 1px solid var(--hairline);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }

  .sidebar-header {
    padding: 20px 20px 12px;
    border-bottom: 1px solid var(--hairline);
  }

  .sidebar-header h2 {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 20px;
    letter-spacing: -0.3px;
    margin-bottom: 4px;
  }

  .sidebar-header p {
    font-size: 12px;
    color: var(--muted);
  }

  .sidebar-toolbar {
    display: flex;
    gap: 6px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--hairline);
    flex-wrap: wrap;
  }

  .sidebar-toolbar .btn {
    height: 30px;
    font-size: 12px;
    padding: 0 10px;
  }

  .file-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
  }

  .phase-group {
    margin-bottom: 8px;
  }

  .phase-label {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    padding: 12px 20px 6px;
  }

  .file-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 20px;
    cursor: pointer;
    border-left: 3px solid transparent;
    transition: all 0.1s;
    user-select: none;
  }

  .file-item:hover {
    background: var(--surface-card);
  }

  .file-item.active {
    background: var(--surface-card);
    border-left-color: var(--brand-coral);
  }

  .file-icon {
    width: 16px; height: 16px;
    flex-shrink: 0;
    color: var(--muted);
  }

  .file-info {
    flex: 1;
    min-width: 0;
  }

  .file-name {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 500;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .file-desc {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .file-item.modified .file-name::after {
    content: " ●";
    color: var(--brand-coral);
  }

  /* EDITOR AREA */
  .editor-area {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .editor-header {
    height: 48px;
    padding: 0 20px;
    border-bottom: 1px solid var(--hairline);
    background: var(--canvas);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .editor-tab {
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
  }

  .editor-tab .phase-pill {
    background: var(--surface-card);
    color: var(--muted);
    padding: 3px 10px;
    border-radius: var(--r-pill);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.3px;
  }

  .editor-actions {
    display: flex;
    gap: 6px;
  }

  .editor-container {
    flex: 1;
    overflow: hidden;
    position: relative;
  }

  .CodeMirror {
    height: 100% !important;
    font-family: var(--font-mono) !important;
    font-size: 13.5px !important;
    line-height: 1.6 !important;
  }

  .empty-state {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    padding: 40px;
    text-align: center;
  }

  .empty-state svg {
    width: 80px; height: 80px;
    opacity: 0.3;
    margin-bottom: 20px;
  }

  .empty-state h3 {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 24px;
    color: var(--ink);
    margin-bottom: 8px;
    letter-spacing: -0.3px;
  }

  .empty-state p {
    font-size: 14px;
    line-height: 1.6;
    max-width: 480px;
    margin-bottom: 20px;
  }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--primary);
    color: var(--on-primary);
    padding: 10px 20px;
    border-radius: var(--r-pill);
    font-size: 13px;
    font-weight: 500;
    z-index: 100;
    opacity: 0;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    max-width: calc(100vw - 48px);
    text-align: center;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  /* MODAL */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(10, 10, 10, 0.5);
    backdrop-filter: blur(6px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 200;
    padding: 24px;
  }
  .modal-backdrop.open { display: flex; }

  .modal {
    background: var(--canvas);
    border-radius: var(--r-xl);
    padding: 28px;
    max-width: 480px;
    width: 100%;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.18);
  }

  .modal h3 {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 22px;
    margin-bottom: 16px;
    letter-spacing: -0.3px;
  }

  .modal-field {
    margin-bottom: 14px;
  }
  .modal-field label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--body);
    margin-bottom: 6px;
  }
  .modal-field input, .modal-field select {
    width: 100%;
    height: 40px;
    padding: 0 12px;
    border: 1px solid var(--hairline);
    background: var(--canvas);
    border-radius: var(--r-md);
    font-family: var(--font-body);
    font-size: 14px;
  }
  .modal-field input:focus, .modal-field select:focus {
    outline: none; border-color: var(--ink);
  }
  .modal-actions {
    display: flex; justify-content: flex-end; gap: 8px;
    margin-top: 20px;
  }

  /* RESPONSIVE */
  @media (max-width: 900px) {
    .workspace {
      grid-template-columns: 1fr;
      grid-template-rows: 200px 1fr;
    }
    .sidebar { border-right: none; border-bottom: 1px solid var(--hairline); }
    .nav-link[data-collapsible] { display: none; }
  }
</style>
</head>

<script>

const INITIAL_CODE_DATA = `[{"id": "file_1779400000000_000", "name": "__init__.py", "phase": "공통", "description": "src 패키지 마커", "content": "\\"\\"\\"Gaegle 캡스톤 - Vision-AI Gesture Tracking Lighting\\n\\n라즈베리파이 실행 코드 루트 패키지.\\n\\n실행:\\n    cd <레포 폴더>\\n    python -m src.main\\n    python -m src.tests.servo_test\\n\\"\\"\\"\\n"}, {"id": "file_1779400000001_001", "name": "config.py", "phase": "공통", "description": "핀 번호, 서보/LED 캘리브 상수, 상태 enum", "content": "\\"\\"\\"\\nGaegle 캡스톤 · 공통 설정 파일\\n회로 결선도(circuit.html)와 일치해야 함. 핀 변경 시 여기만 수정.\\n\\"\\"\\"\\n\\n# ============ I2C ============\\nI2C_BUS = 1                  # Raspberry Pi 5 기본 I2C 버스\\nPCA9685_ADDRESS = 0x40       # PCA9685 기본 주소\\nPCA9685_FREQ = 333            # 50 → 333Hz. 주기 3ms로 단축\\n\\n# ============ PCA9685 채널 ============\\nSERVO_PAN_CH = 0             # MG946R - 수평 회전 (하단)\\nSERVO_TILT_CH = 1            # MG90S  - 수직 회전 (상단)\\n\\n# ============ 서보 캘리브레이션 ============\\n# PCA9685는 12-bit (0~4095) PWM\\n# 50Hz 기준 1ms = 약 205, 2ms = 약 410\\nSERVO_MIN_PULSE = 150        # 0도 위치 (약 0.73ms)\\nSERVO_MAX_PULSE = 600        # 180도 위치 (약 2.93ms)\\n\\n# Pan/Tilt 안전 각도 제한 (기구적 한계)\\nPAN_MIN_DEG = 0\\nPAN_MAX_DEG = 180\\nTILT_MIN_DEG = 30            # 너무 위로 꺾이면 LED가 천장 향함\\nTILT_MAX_DEG = 150           # 너무 아래로 꺾이면 짐벌 부딪힘\\n\\n# 부드러운 이동을 위한 속도 제한 (deg/step)\\nSERVO_MAX_STEP_DEG = 0.5       # 0.5° 단위로 쪼갬 (기존이 2~3°면 확 부드러워짐)\\nSERVO_STEP_DELAY_S = 0.003    # 15ms = 약 66Hz. PCA9685 50Hz면 0.02도 OK\\n\\n# ============ GPIO 핀 (BCM 번호) ============\\nPIN_LED_SPOT_PWM = 12        # 10W LED MOSFET 게이트 → GPIO 12 (Pin 32)\\nPIN_LED_MOOD_PWM = 13        # 3W LED HAM3005 DIM → GPIO 13 (Pin 33)\\n\\n# LED PWM 주파수\\nLED_PWM_FREQ = 1000          # 1kHz - 깜박임 안 보이고 LED 드라이버 호환 좋음\\n\\n# ============ 카메라 ============\\nCAMERA_WIDTH_FULL = 640\\nCAMERA_HEIGHT_FULL = 480\\nCAMERA_FPS_FULL = 30\\n\\n# 저전력 모드 (Standby에서 motion 감지용)\\nCAMERA_WIDTH_LOW = 160\\nCAMERA_HEIGHT_LOW = 120\\nCAMERA_FPS_LOW = 10\\n\\n# 사용자 손 실제 길이 (mediapipe 0번 손목 ~ 5번 검지 MCP)\\n# 캘리브레이션 시 사용자 입력\\nHAND_REAL_LENGTH_M = 0.085   # 평균 8.5cm 기본값\\n\\n# ============ 상태 머신 ============\\nclass State:\\n    \\"\\"\\"시스템 상태 enum\\"\\"\\"\\n    STANDBY = \\"STANDBY\\"          # PIR 대기, 카메라 저전력\\n    GESTURE_MODE = \\"GESTURE\\"     # MediaPipe 풀 가동\\n    LOCKED = \\"LOCKED\\"            # 마지막 위치 유지, 인식 OFF\\n\\n# 상태 전환 시간\\nHAND_HOLD_SEC = 3.0              # 3초간 손 정지 → Locked\\nSTANDBY_TIMEOUT_SEC = 60.0       # 1분간 입력 없으면 → Standby\\n\\n# Wave 감지 (좌우 반복 움직임)\\nWAVE_FRAMES = 12                 # 약 0.4초 분량의 프레임으로 wave 판정\\nWAVE_MIN_AMPLITUDE = 80          # 픽셀 단위, 좌우 진폭\\n\\n# ============ 제스처 임계값 ============\\n# Pinch (엄지+검지 거리 비율, 손 크기 기준)\\nPINCH_ENTRY_RATIO = 0.18         # 진입 조건: 거리/손크기 < 0.18\\nPINCH_EXIT_RATIO = 0.30          # 유지 종료: 거리/손크기 > 0.30\\nPINCH_BRIGHT_MIN_RATIO = 0.05    # 0% 밝기\\nPINCH_BRIGHT_MAX_RATIO = 0.50    # 100% 밝기\\n\\n# ============ 로깅 ============\\nLOG_LEVEL = \\"INFO\\"               # DEBUG / INFO / WARNING / ERROR\\nLOG_FORMAT = \\"%(asctime)s [%(levelname)s] %(name)s: %(message)s\\"\\n"}, {"id": "file_1779400000002_002", "name": "core/__init__.py", "phase": "하드웨어 (core)", "description": "core 패키지", "content": "\\"\\"\\"핵심 하드웨어 제어 모듈.\\n\\n- servo_controller: PCA9685 + Pan/Tilt 서보\\n- led_controller: 10W 스팟 + 3W 무드 LED 디밍\\n\\"\\"\\"\\nfrom src.core.servo_controller import ServoController\\nfrom src.core.led_controller import LEDController\\n\\n__all__ = [\\"ServoController\\", \\"LEDController\\"]\\n"}, {"id": "file_1779400000003_003", "name": "core/led_controller.py", "phase": "하드웨어 (core)", "description": "10W 스팟 + 3W 무드 LED PWM 디밍", "content": "\\"\\"\\"\\nLED 컨트롤러 - 10W 스팟 + 3W 무드 LED 디밍 제어\\n\\n회로:\\n- 10W 라인: Pi GPIO 12 → MOSFET 모듈 SIG → HAM2121 → 10W COB LED\\n- 3W 라인:  Pi GPIO 13 → HAM3005 DIM → 3W LED × 8 (병렬)\\n\\nPWM 1kHz 고정. duty 0~100% 입력.\\n\\"\\"\\"\\nimport logging\\nfrom typing import Optional\\n\\ntry:\\n    import lgpio  # Raspberry Pi 5 권장 GPIO 라이브러리\\nexcept ImportError:\\n    lgpio = None\\n\\nfrom src.config import (\\n    PIN_LED_SPOT_PWM, PIN_LED_MOOD_PWM, LED_PWM_FREQ,\\n)\\n\\nlog = logging.getLogger(__name__)\\n\\n\\nclass LEDController:\\n    \\"\\"\\"10W 스팟 + 3W 무드 두 채널 LED 디밍 컨트롤러.\\n    \\n    내부적으로 lgpio의 하드웨어 PWM 사용.\\n    duty는 0~100 범위 입력, 내부에서 0~1 변환.\\n    \\"\\"\\"\\n    \\n    def __init__(self):\\n        self._spot_duty = 0.0\\n        self._mood_duty = 0.0\\n        \\n        if lgpio is None:\\n            log.warning(\\"lgpio not available - running in DRY mode\\")\\n            self.h = None\\n            return\\n        \\n        self.h = lgpio.gpiochip_open(0)\\n        # 출력 모드 설정\\n        lgpio.gpio_claim_output(self.h, PIN_LED_SPOT_PWM, 0)\\n        lgpio.gpio_claim_output(self.h, PIN_LED_MOOD_PWM, 0)\\n        log.info(f\\"LED PWM ready (Spot=GPIO{PIN_LED_SPOT_PWM}, Mood=GPIO{PIN_LED_MOOD_PWM}, {LED_PWM_FREQ}Hz)\\")\\n    \\n    def _set_pwm(self, pin: int, duty_percent: float):\\n        \\"\\"\\"0~100 → 0~100 duty cycle PWM 설정.\\"\\"\\"\\n        duty = max(0.0, min(100.0, duty_percent))\\n        if self.h is None:\\n            log.debug(f\\"[DRY] PWM pin {pin} duty={duty:.1f}%\\")\\n            return\\n        try:\\n            # lgpio.tx_pwm(handle, gpio, freq, duty_cycle 0~100)\\n            lgpio.tx_pwm(self.h, pin, LED_PWM_FREQ, duty)\\n        except Exception as e:\\n            log.error(f\\"PWM error on pin {pin}: {e}\\")\\n    \\n    # ---------- Spot (10W) ----------\\n    \\n    def spot_set(self, duty_percent: float):\\n        \\"\\"\\"10W 스팟 조명 밝기 설정 (0~100%).\\"\\"\\"\\n        self._spot_duty = max(0.0, min(100.0, duty_percent))\\n        self._set_pwm(PIN_LED_SPOT_PWM, self._spot_duty)\\n        log.debug(f\\"Spot LED → {self._spot_duty:.1f}%\\")\\n    \\n    def spot_on(self, duty_percent: float = 80.0):\\n        self.spot_set(duty_percent)\\n    \\n    def spot_off(self):\\n        self.spot_set(0)\\n    \\n    # ---------- Mood (3W × 8) ----------\\n    \\n    def mood_set(self, duty_percent: float):\\n        \\"\\"\\"3W 무드 LED 밝기 설정 (0~100%).\\"\\"\\"\\n        self._mood_duty = max(0.0, min(100.0, duty_percent))\\n        self._set_pwm(PIN_LED_MOOD_PWM, self._mood_duty)\\n        log.debug(f\\"Mood LED → {self._mood_duty:.1f}%\\")\\n    \\n    def mood_on(self, duty_percent: float = 40.0):\\n        self.mood_set(duty_percent)\\n    \\n    def mood_off(self):\\n        self.mood_set(0)\\n    \\n    # ---------- 통합 제어 ----------\\n    \\n    def all_off(self):\\n        \\"\\"\\"모든 LED 끄기.\\"\\"\\"\\n        self.spot_off()\\n        self.mood_off()\\n        log.info(\\"All LEDs off\\")\\n    \\n    def get_state(self) -> dict:\\n        return {\\n            \\"spot_duty\\": self._spot_duty,\\n            \\"mood_duty\\": self._mood_duty,\\n        }\\n    \\n    def shutdown(self):\\n        \\"\\"\\"GPIO 해제.\\"\\"\\"\\n        self.all_off()\\n        if self.h is not None:\\n            try:\\n                lgpio.gpiochip_close(self.h)\\n            except Exception as e:\\n                log.error(f\\"Close error: {e}\\")\\n        log.info(\\"LED controller shutdown\\")\\n    \\n    def __enter__(self):\\n        return self\\n    \\n    def __exit__(self, *args):\\n        self.shutdown()\\n"}, {"id": "file_1779400000004_004", "name": "core/servo_controller.py", "phase": "하드웨어 (core)", "description": "PCA9685 + Pan/Tilt 서보 제어", "content": "\\"\\"\\"\\n서보 컨트롤러 - PCA9685 I2C PWM 드라이버를 통해 Pan/Tilt 짐벌을 제어\\n회로: Raspberry Pi → I2C → PCA9685 → MG946R/MG90S\\n\\"\\"\\"\\nimport logging\\nimport time\\nfrom typing import Optional\\nimport math\\n\\ntry:\\n    from adafruit_servokit import ServoKit\\nexcept ImportError:\\n    ServoKit = None  # 실제 라즈베리파이가 아닐 때 (테스트용)\\n\\nfrom src.config import (\\n    PCA9685_ADDRESS, PCA9685_FREQ,\\n    SERVO_PAN_CH, SERVO_TILT_CH,\\n    PAN_MIN_DEG, PAN_MAX_DEG, TILT_MIN_DEG, TILT_MAX_DEG,\\n    SERVO_MAX_STEP_DEG, SERVO_STEP_DELAY_S,\\n)\\n\\nlog = logging.getLogger(__name__)\\n\\n\\nclass ServoController:\\n    \\"\\"\\"Pan-Tilt 짐벌 제어 클래스.\\n    \\n    PCA9685를 통해 두 서보의 각도를 부드럽게 제어.\\n    급격한 이동 시 발생하는 지터를 방지하기 위해 단계적 이동(step) 사용.\\n    \\"\\"\\"\\n    \\n    def __init__(self):\\n        if ServoKit is None:\\n            log.warning(\\"adafruit_servokit not available - running in DRY mode\\")\\n            self.kit = None\\n        else:\\n            self.kit = ServoKit(channels=16, address=PCA9685_ADDRESS, frequency=PCA9685_FREQ)\\n            log.info(f\\"PCA9685 initialized at 0x{PCA9685_ADDRESS:02X}, {PCA9685_FREQ}Hz\\")\\n        \\n        # 현재 각도 추적 (부드러운 이동용)\\n        self._current_pan = 90.0\\n        self._current_tilt = 90.0\\n        \\n        # 초기 위치로 이동 (중앙)\\n        self.move_to(90, 90, smooth=False)\\n    \\n    def _clamp_pan(self, deg: float) -> float:\\n        return max(PAN_MIN_DEG, min(PAN_MAX_DEG, deg))\\n    \\n    def _clamp_tilt(self, deg: float) -> float:\\n        return max(TILT_MIN_DEG, min(TILT_MAX_DEG, deg))\\n    \\n    def _set_raw(self, channel: int, angle: float):\\n        \\"\\"\\"PCA9685 채널에 직접 각도 명령 전송.\\"\\"\\"\\n        if self.kit is None:\\n            log.debug(f\\"[DRY] CH{channel} → {angle:.1f}°\\")\\n            return\\n        try:\\n            self.kit.servo[channel].angle = angle\\n        except Exception as e:\\n            log.error(f\\"Failed to set CH{channel} to {angle}°: {e}\\")\\n    \\n    def move_to(self, pan_deg: float, tilt_deg: float, smooth: bool = True):\\n        pan_target = self._clamp_pan(pan_deg)\\n        tilt_target = self._clamp_tilt(tilt_deg)\\n        \\n        if not smooth:\\n            self._set_raw(SERVO_PAN_CH, pan_target)\\n            self._set_raw(SERVO_TILT_CH, tilt_target)\\n            self._current_pan = pan_target\\n            self._current_tilt = tilt_target\\n            return\\n        \\n        pan_delta = pan_target - self._current_pan\\n        tilt_delta = tilt_target - self._current_tilt\\n        max_delta = max(abs(pan_delta), abs(tilt_delta))\\n        \\n        if max_delta < 0.1:  # 거의 안 움직이면 skip\\n            return\\n        \\n        steps = max(int(max_delta / SERVO_MAX_STEP_DEG), 1)\\n        pan_start = self._current_pan\\n        tilt_start = self._current_tilt\\n        \\n        for i in range(1, steps + 1):\\n            t = i / steps\\n            # ease-in-out: 0.5 - 0.5*cos(pi*t)\\n            eased = 0.5 - 0.5 * math.cos(math.pi * t)\\n            pan_now = pan_start + pan_delta * eased\\n            tilt_now = tilt_start + tilt_delta * eased\\n            self._set_raw(SERVO_PAN_CH, pan_now)\\n            self._set_raw(SERVO_TILT_CH, tilt_now)\\n            time.sleep(SERVO_STEP_DELAY_S)\\n        \\n        self._current_pan = pan_target\\n        self._current_tilt = tilt_target\\n    \\n    def get_position(self) -> tuple[float, float]:\\n        \\"\\"\\"현재 (pan, tilt) 각도 반환.\\"\\"\\"\\n        return self._current_pan, self._current_tilt\\n    \\n    def home(self):\\n        \\"\\"\\"중앙 위치로 복귀 (서보 보호용).\\"\\"\\"\\n        log.info(\\"Homing to center\\")\\n        self.move_to(90, 90, smooth=True)\\n    \\n    def shutdown(self):\\n        \\"\\"\\"서보 PWM 끄기 (idle 상태 진입 시 사용).\\"\\"\\"\\n        if self.kit is None:\\n            return\\n        try:\\n            # PCA9685 채널에 None 할당하면 PWM 출력 정지\\n            self.kit.servo[SERVO_PAN_CH].angle = None\\n            self.kit.servo[SERVO_TILT_CH].angle = None\\n            log.info(\\"Servo PWM disabled\\")\\n        except Exception as e:\\n            log.error(f\\"Shutdown error: {e}\\")\\n    \\n    def __enter__(self):\\n        return self\\n    \\n    def __exit__(self, *args):\\n        self.shutdown()\\n"}, {"id": "file_1779400000005_005", "name": "main.py", "phase": "공통", "description": "엔트리포인트 (vision runtime 호출)", "content": "\\"\\"\\"\\nGaegle 메인 엔트리포인트\\n\\n실행:\\n    python -m src.main\\n    python src/main.py\\n\\n내부적으로 src/vision/raspberry_pi_runtime.py 의 main()을 호출.\\n서보(PCA9685) + LED(lgpio PWM) 통합 제스처 인식 런타임이 그쪽에 있음.\\n\\"\\"\\"\\nimport sys\\nfrom pathlib import Path\\n\\n# \`python src/main.py\`로 직접 실행해도 동작하도록 프로젝트 루트를 sys.path에 추가.\\n# raspberry_pi_runtime.py 및 내부 모듈들이 \`from pi_runtime_config import ...\`\\n# 식의 bare import를 쓰므로, src/vision/ 도 앞에 추가한다.\\n_PROJECT_ROOT = Path(__file__).resolve().parent.parent\\n_VISION_DIR = Path(__file__).resolve().parent / \\"vision\\"\\nfor _p in (_PROJECT_ROOT, _VISION_DIR):\\n    if str(_p) not in sys.path:\\n        sys.path.insert(0, str(_p))\\n\\nfrom src.vision.raspberry_pi_runtime import main  # noqa: E402\\n\\n\\nif __name__ == \\"__main__\\":\\n    main()\\n"}, {"id": "file_1779400000006_006", "name": "state/__init__.py", "phase": "상태머신 (state)", "description": "state 패키지", "content": "\\"\\"\\"상태 머신 모듈.\\n\\n- state_machine: Standby ↔ Gesture Mode ↔ Locked 전이 관리\\n\\"\\"\\"\\nfrom src.state.state_machine import StateMachine\\n\\n__all__ = [\\"StateMachine\\"]\\n"}, {"id": "file_1779400000007_007", "name": "state/state_machine.py", "phase": "상태머신 (state)", "description": "Standby/Gesture/Locked 상태 전이", "content": "\\"\\"\\"\\n상태 머신 - Standby ↔ Gesture Mode ↔ Locked 전환 관리\\n\\n상태 다이어그램 (중간보고서):\\n    [STANDBY]  --Wave-->         [GESTURE_MODE]\\n    [STANDBY]  <--Fist--         [GESTURE_MODE]\\n    [GESTURE_MODE] --3초 정지--> [LOCKED]\\n    [LOCKED]   --Wave-->         [GESTURE_MODE]\\n\\n각 상태별 동작:\\n- STANDBY: 카메라 저전력, MediaPipe 미가동, 조명 OFF\\n- GESTURE_MODE: 카메라 풀 가동, 모든 제스처 인식\\n- LOCKED: 마지막 위치 유지, 제스처 인식 OFF, 조명 ON 유지\\n\\"\\"\\"\\nimport logging\\nimport time\\nfrom typing import Callable, Optional\\n\\nfrom src.config import State, HAND_HOLD_SEC, STANDBY_TIMEOUT_SEC\\n\\nlog = logging.getLogger(__name__)\\n\\n\\nclass StateMachine:\\n    \\"\\"\\"시스템 상태 관리 + 자동 타임아웃 처리.\\"\\"\\"\\n    \\n    def __init__(self,\\n                 on_state_change: Optional[Callable[[str, str], None]] = None):\\n        \\"\\"\\"on_state_change(old_state, new_state) 콜백을 받음.\\"\\"\\"\\n        self._state = State.STANDBY\\n        self._on_state_change = on_state_change\\n        \\n        # 손 정지 감지를 위한 타임스탬프\\n        self._last_motion_time = time.time()\\n        self._hand_hold_start: Optional[float] = None\\n    \\n    @property\\n    def state(self) -> str:\\n        return self._state\\n    \\n    def _transition(self, new_state: str, reason: str = \\"\\"):\\n        \\"\\"\\"상태 전이 + 콜백 호출.\\"\\"\\"\\n        if new_state == self._state:\\n            return\\n        \\n        old = self._state\\n        self._state = new_state\\n        log.info(f\\"State: {old} → {new_state}  ({reason})\\")\\n        \\n        # 타이머 리셋\\n        self._last_motion_time = time.time()\\n        self._hand_hold_start = None\\n        \\n        if self._on_state_change:\\n            try:\\n                self._on_state_change(old, new_state)\\n            except Exception as e:\\n                log.error(f\\"State change callback error: {e}\\")\\n    \\n    # ============ 이벤트 핸들러 ============\\n    \\n    def on_wave(self):\\n        \\"\\"\\"Wave 제스처 감지 시 호출.\\"\\"\\"\\n        if self._state == State.STANDBY:\\n            self._transition(State.GESTURE_MODE, \\"Wave detected (wake)\\")\\n        elif self._state == State.LOCKED:\\n            self._transition(State.GESTURE_MODE, \\"Wave detected (unlock)\\")\\n        else:\\n            log.debug(\\"Wave ignored (already in GESTURE_MODE)\\")\\n    \\n    def on_fist(self):\\n        \\"\\"\\"Fist 제스처 감지 시 호출 - 조명 OFF + Standby 복귀.\\"\\"\\"\\n        if self._state == State.GESTURE_MODE:\\n            self._transition(State.STANDBY, \\"Fist detected (shutdown)\\")\\n    \\n    def on_pir_motion(self):\\n        \\"\\"\\"PIR이 사람 감지. Standby 상태에서만 의미 있음.\\"\\"\\"\\n        if self._state == State.STANDBY:\\n            log.debug(\\"PIR motion in STANDBY - camera wakeup ready\\")\\n            # 카메라 풀 가동 트리거는 vision pipeline에서 처리\\n        self._last_motion_time = time.time()\\n    \\n    def on_hand_present(self, is_holding_still: bool):\\n        \\"\\"\\"매 프레임 손 존재 여부 보고.\\n        \\n        is_holding_still: 손이 일정 위치에 정지해있는지.\\n                          True가 HAND_HOLD_SEC 이상 지속되면 → LOCKED 전환.\\n        \\"\\"\\"\\n        if self._state != State.GESTURE_MODE:\\n            self._hand_hold_start = None\\n            return\\n        \\n        now = time.time()\\n        self._last_motion_time = now\\n        \\n        if is_holding_still:\\n            if self._hand_hold_start is None:\\n                self._hand_hold_start = now\\n            elif now - self._hand_hold_start >= HAND_HOLD_SEC:\\n                self._transition(State.LOCKED, f\\"Hand held for {HAND_HOLD_SEC}s\\")\\n        else:\\n            self._hand_hold_start = None\\n    \\n    def tick(self):\\n        \\"\\"\\"매 메인 루프마다 호출. 타임아웃 체크.\\n        \\n        GESTURE_MODE에서 일정 시간 입력 없으면 자동 Standby.\\n        \\"\\"\\"\\n        if self._state == State.GESTURE_MODE:\\n            if time.time() - self._last_motion_time > STANDBY_TIMEOUT_SEC:\\n                self._transition(State.STANDBY, f\\"No input for {STANDBY_TIMEOUT_SEC}s\\")\\n    \\n    def force_state(self, new_state: str, reason: str = \\"manual\\"):\\n        \\"\\"\\"디버깅용 강제 상태 전환.\\"\\"\\"\\n        self._transition(new_state, reason)\\n"}, {"id": "file_1779400000008_008", "name": "tests/__init__.py", "phase": "테스트 (tests)", "description": "tests 패키지", "content": "\\"\\"\\"하드웨어 단독 검증 스크립트.\\n\\n실행:\\n    python -m src.tests.servo_test   # Phase 2 검증\\n    python -m src.tests.led_test     # Phase 3 검증\\n\\"\\"\\"\\n"}, {"id": "file_1779400000009_009", "name": "tests/led_test.py", "phase": "테스트 (tests)", "description": "LED 단독 동작 검증", "content": "\\"\\"\\"\\nLED 단독 테스트 - Phase 3 검증용\\n\\n실행:\\n    sudo python3 -m src.tests.led_test\\n\\n테스트:\\n1. Spot/Mood 각각 ON/OFF\\n2. 0~100% 디밍 스윕\\n3. 양쪽 동시 페이드\\n\\"\\"\\"\\nimport logging\\nimport time\\nimport sys\\n\\nfrom src.config import LOG_FORMAT, LOG_LEVEL\\nfrom src.core.led_controller import LEDController\\n\\nlogging.basicConfig(level=LOG_LEVEL, format=LOG_FORMAT)\\nlog = logging.getLogger(\\"led_test\\")\\n\\n\\ndef test_basic_onoff(led: LEDController):\\n    \\"\\"\\"1단계: ON/OFF 기본 확인.\\"\\"\\"\\n    log.info(\\"=== Test 1: Basic ON/OFF ===\\")\\n    log.info(\\"Spot ON (50%)\\")\\n    led.spot_set(50)\\n    time.sleep(2)\\n    led.spot_off()\\n    time.sleep(0.5)\\n    \\n    log.info(\\"Mood ON (50%)\\")\\n    led.mood_set(50)\\n    time.sleep(2)\\n    led.mood_off()\\n    time.sleep(0.5)\\n\\n\\ndef test_dimming_sweep(led: LEDController):\\n    \\"\\"\\"2단계: 0~100% 부드러운 스윕.\\"\\"\\"\\n    log.info(\\"=== Test 2: Spot dimming sweep ===\\")\\n    for duty in range(0, 101, 5):\\n        led.spot_set(duty)\\n        time.sleep(0.05)\\n    for duty in range(100, -1, -5):\\n        led.spot_set(duty)\\n        time.sleep(0.05)\\n    \\n    log.info(\\"=== Test 3: Mood dimming sweep ===\\")\\n    for duty in range(0, 101, 5):\\n        led.mood_set(duty)\\n        time.sleep(0.05)\\n    for duty in range(100, -1, -5):\\n        led.mood_set(duty)\\n        time.sleep(0.05)\\n\\n\\ndef test_simultaneous(led: LEDController):\\n    \\"\\"\\"4단계: 양쪽 동시 페이드 (한쪽이 켜질 때 다른 쪽 꺼짐).\\"\\"\\"\\n    log.info(\\"=== Test 4: Cross-fade ===\\")\\n    for i in range(0, 101, 2):\\n        led.spot_set(i)\\n        led.mood_set(100 - i)\\n        time.sleep(0.03)\\n    for i in range(100, -1, -2):\\n        led.spot_set(i)\\n        led.mood_set(100 - i)\\n        time.sleep(0.03)\\n    led.all_off()\\n\\n\\ndef main():\\n    log.info(\\"LED test starting. Watch heat sink temperature!\\")\\n    log.info(\\"⚠ Do NOT look directly at 10W LED. Check via reflection.\\")\\n    \\n    try:\\n        with LEDController() as led:\\n            test_basic_onoff(led)\\n            test_dimming_sweep(led)\\n            test_simultaneous(led)\\n            log.info(\\"✓ All tests complete\\")\\n    except KeyboardInterrupt:\\n        log.warning(\\"Interrupted\\")\\n        sys.exit(1)\\n    except Exception as e:\\n        log.error(f\\"Test failed: {e}\\", exc_info=True)\\n        sys.exit(2)\\n\\n\\nif __name__ == \\"__main__\\":\\n    main()\\n"}, {"id": "file_1779400000010_010", "name": "tests/servo_test.py", "phase": "테스트 (tests)", "description": "서보 단독 동작 검증", "content": "\\"\\"\\"\\n서보 단독 테스트 - Phase 2 검증용\\n회로 결선 후 가장 먼저 실행해서 짐벌 동작 확인.\\n\\n실행:\\n    sudo python3 -m src.tests.servo_test\\n\\n테스트 시나리오:\\n1. 두 축이 0°, 45°, 90°, 135°, 180°로 차례로 이동\\n2. Pan만 좌우 스윕 (Tilt 고정)\\n3. Tilt만 위아래 스윕 (Pan 고정)\\n4. 대각선 이동\\n\\"\\"\\"\\nimport logging\\nimport time\\nimport sys\\n\\nfrom src.config import LOG_FORMAT, LOG_LEVEL, TILT_MIN_DEG, TILT_MAX_DEG\\nfrom src.core.servo_controller import ServoController\\n\\nlogging.basicConfig(level=LOG_LEVEL, format=LOG_FORMAT)\\nlog = logging.getLogger(\\"servo_test\\")\\n\\n\\ndef test_basic_angles(servo: ServoController):\\n    \\"\\"\\"1단계: 기본 각도 5개 위치 확인.\\"\\"\\"\\n    log.info(\\"=== Test 1: Basic angles ===\\")\\n    angles = [0, 45, 90, 135, 180]\\n    for ang in angles:\\n        log.info(f\\"Moving both axes to {ang}°\\")\\n        # tilt은 기구 제한 안에서\\n        tilt_ang = max(TILT_MIN_DEG, min(TILT_MAX_DEG, ang))\\n        servo.move_to(ang, tilt_ang)\\n        time.sleep(1.0)\\n\\n\\ndef test_pan_sweep(servo: ServoController):\\n    log.info(\\"=== Test 2: Pan sweep ===\\")\\n    servo.move_to(0, 90)\\n    time.sleep(0.3)\\n    servo.move_to(180, 90)   # 0→180 한 번에\\n    servo.move_to(0, 90)     # 180→0 한 번에\\n\\ndef test_tilt_sweep(servo: ServoController):\\n    log.info(\\"=== Test 3: Tilt sweep ===\\")\\n    servo.move_to(90, TILT_MIN_DEG)\\n    time.sleep(0.3)\\n    servo.move_to(90, TILT_MAX_DEG)\\n    servo.move_to(90, TILT_MIN_DEG)\\n\\n\\ndef test_diagonal(servo: ServoController):\\n    \\"\\"\\"4단계: 대각선 이동 (두 축 동시 구동).\\"\\"\\"\\n    log.info(\\"=== Test 4: Diagonal movement ===\\")\\n    waypoints = [\\n        (0, TILT_MIN_DEG),\\n        (180, TILT_MAX_DEG),\\n        (180, TILT_MIN_DEG),\\n        (0, TILT_MAX_DEG),\\n        (90, 90),  # 마지막 중앙\\n    ]\\n    for pan, tilt in waypoints:\\n        log.info(f\\"→ Pan={pan}°, Tilt={tilt}°\\")\\n        servo.move_to(pan, tilt)\\n        time.sleep(0.8)\\n\\n\\ndef main():\\n    log.info(\\"Servo test starting. Press Ctrl+C to abort.\\")\\n    try:\\n        with ServoController() as servo:\\n            test_basic_angles(servo)\\n            time.sleep(1.0)\\n            test_pan_sweep(servo)\\n            time.sleep(1.0)\\n            test_tilt_sweep(servo)\\n            time.sleep(1.0)\\n            test_diagonal(servo)\\n            \\n            log.info(\\"✓ All tests complete. Homing.\\")\\n            servo.home()\\n            time.sleep(1.0)\\n    except KeyboardInterrupt:\\n        log.warning(\\"Interrupted by user\\")\\n        sys.exit(1)\\n    except Exception as e:\\n        log.error(f\\"Test failed: {e}\\", exc_info=True)\\n        sys.exit(2)\\n\\n\\nif __name__ == \\"__main__\\":\\n    main()\\n"}, {"id": "file_1779400000011_011", "name": "vision/fisheye_undistort.py", "phase": "비전 (vision)", "description": "fisheye 왜곡 보정", "content": "\\"\\"\\"\\nFisheye 카메라 캘리브레이션 적용 — 손가락 추적 전 프레임 왜곡 보정.\\n\\n사용 흐름:\\n    undist = FisheyeUndistorter(\\"src/calibration/fisheye_undistort_map.npz\\",\\n                                target_size=(FRAME_W, FRAME_H))\\n    frame = undist.undistort(frame)\\n    # undist.fx, undist.fy, undist.cx, undist.cy 는 rectified 좌표계의 실제 intrinsics\\n\\"\\"\\"\\nimport cv2\\nimport numpy as np\\n\\n\\nclass FisheyeUndistorter:\\n    \\"\\"\\"캘리브레이션된 fisheye → rectified 변환. 런타임 해상도에 맞춰 맵을 재생성한다.\\"\\"\\"\\n\\n    def __init__(self, npz_path, target_size):\\n        \\"\\"\\"\\n        npz_path: 캘리브레이션 파일 경로 (.npz)\\n        target_size: 런타임 프레임 (W, H)\\n        \\"\\"\\"\\n        data = np.load(npz_path)\\n        K_orig = data[\\"camera_matrix\\"]      # (3, 3)\\n        D = data[\\"dist_coeffs\\"]             # (4, 1)\\n        P_orig = data[\\"new_camera_matrix\\"]  # (3, 3)\\n        calib_w, calib_h = (int(x) for x in data[\\"image_size\\"])\\n\\n        tw, th = int(target_size[0]), int(target_size[1])\\n        sx = tw / calib_w\\n        sy = th / calib_h\\n\\n        # K (원본 카메라 행렬)와 P (rectified 카메라 행렬) 모두 target 해상도로 스케일\\n        K = K_orig.copy()\\n        K[0, 0] *= sx\\n        K[1, 1] *= sy\\n        K[0, 2] *= sx\\n        K[1, 2] *= sy\\n\\n        P = P_orig.copy()\\n        P[0, 0] *= sx\\n        P[1, 1] *= sy\\n        P[0, 2] *= sx\\n        P[1, 2] *= sy\\n\\n        # target_size에 맞춘 remap 맵 생성 (한 번만 수행)\\n        self.map1, self.map2 = cv2.fisheye.initUndistortRectifyMap(\\n            K, D, np.eye(3), P, (tw, th), cv2.CV_16SC2,\\n        )\\n        self.K = K\\n        self.D = D\\n        self.P = P\\n        self.target_size = (tw, th)\\n        self.calib_size = (calib_w, calib_h)\\n        self.rms = float(data[\\"rms\\"])\\n\\n    def undistort(self, frame):\\n        \\"\\"\\"fisheye 보정된 frame 반환. 입력과 동일 해상도.\\"\\"\\"\\n        return cv2.remap(frame, self.map1, self.map2, interpolation=cv2.INTER_LINEAR)\\n\\n    # rectified intrinsics — pan/tilt 계산에 사용\\n    @property\\n    def fx(self):\\n        return float(self.P[0, 0])\\n\\n    @property\\n    def fy(self):\\n        return float(self.P[1, 1])\\n\\n    @property\\n    def cx(self):\\n        return float(self.P[0, 2])\\n\\n    @property\\n    def cy(self):\\n        return float(self.P[1, 2])\\n"}, {"id": "file_1779400000012_012", "name": "vision/gestures.py", "phase": "비전 (vision)", "description": "손 랜드마크 → 제스처 분류", "content": "import math\\nimport time\\nfrom collections import deque\\n\\n\\nclass GestureRecognizer:\\n    def __init__(self):\\n        self.WRIST = 0\\n        self.THUMB_MCP = 2\\n        self.THUMB_IP = 3\\n        self.THUMB_TIP = 4\\n\\n        self.INDEX_FINGER_MCP = 5\\n        self.INDEX_FINGER_PIP = 6\\n        self.INDEX_FINGER_TIP = 8\\n\\n        self.MIDDLE_FINGER_MCP = 9\\n        self.MIDDLE_FINGER_PIP = 10\\n        self.MIDDLE_FINGER_TIP = 12\\n\\n        self.RING_FINGER_MCP = 13\\n        self.RING_FINGER_PIP = 14\\n        self.RING_FINGER_TIP = 16\\n\\n        self.PINKY_MCP = 17\\n        self.PINKY_PIP = 18\\n        self.PINKY_TIP = 20\\n\\n        self.last_gesture = None\\n        self.gesture_counter = 0\\n        self.threshold = 5\\n\\n        self.FOUR_FINGER_AIM_Z_THRESHOLD = 0.002\\n        self.FOUR_FINGER_AIM_PROJECTION_RATIO_MAX = 0.98\\n        self.FOUR_FINGER_OPEN_3D_THRESHOLD = 0.45\\n        self.FOUR_FINGER_SWIPE_THRESHOLD = 0.06\\n        self.FOUR_FINGER_SWIPE_Y_MAX = 0.35\\n        self.FOUR_FINGER_SWIPE_PALM_MAX = 0.35\\n        self.FOUR_FINGER_SWIPE_MIN_TIME = 0.05\\n        self.FOUR_FINGER_SWIPE_MAX_TIME = 0.45\\n        self.FOUR_FINGER_PALM_STABILITY_MAX = 0.70\\n        self.FOUR_FINGER_SWIPE_TO_PALM_RATIO = 2.0\\n        self.FOUR_FINGER_HORIZONTAL_RATIO = 1.2\\n        self.FOUR_FINGER_MAX_DIRECTION_TURNS = 0\\n        self.FOUR_FINGER_SWIPE_HISTORY_FRAMES = 10\\n        self.TICK_COOLDOWN = 0.80\\n        self.MIRROR_TICK_DIRECTION = True\\n        self.THUMB_DIRECTION_THRESHOLD = 0.30\\n        self.THUMB_SMOOTHING_FRAMES = 6\\n        self.THUMB_SMOOTHING_MIN_HITS = 4\\n\\n        self.wrist_history = deque()\\n        self.four_finger_swipe_history = deque(maxlen=self.FOUR_FINGER_SWIPE_HISTORY_FRAMES)\\n        self.thumb_gesture_history = deque(maxlen=self.THUMB_SMOOTHING_FRAMES)\\n        self.neutral_palm_x = None\\n        self.neutral_palm_y = None\\n        self.tick_state = \\"READY\\"\\n        self.tick_direction = None\\n        self.cooldown_start_time = 0.0\\n        self.debug_state = self._empty_debug_state()\\n\\n    def _empty_debug_state(self):\\n        return {\\n            \\"point_mode_candidate\\": False,\\n            \\"four_finger_aim_candidate\\": False,\\n            \\"index_open\\": False,\\n            \\"middle_open\\": False,\\n            \\"ring_open\\": False,\\n            \\"pinky_open\\": False,\\n            \\"thumbs_up_candidate\\": False,\\n            \\"thumbs_down_candidate\\": False,\\n            \\"thumb_direction_delta\\": 0.0,\\n            \\"aim_vector_x\\": 0.0,\\n            \\"aim_vector_y\\": 0.0,\\n            \\"aim_vector_z\\": 0.0,\\n            \\"aim_depth_ok\\": False,\\n            \\"aim_projection_ratio\\": 1.0,\\n            \\"fist_blocked_by_four_finger_aim\\": False,\\n            \\"swipe_delta_x\\": 0.0,\\n            \\"swipe_delta_y\\": 0.0,\\n            \\"swipe_elapsed\\": 0.0,\\n            \\"swipe_turns\\": 0,\\n            \\"four_finger_reject_reason\\": \\"\\",\\n            \\"finger_offset_x\\": None,\\n            \\"relative_offset_x\\": 0.0,\\n            \\"finger_offset_y\\": None,\\n            \\"relative_offset_y\\": 0.0,\\n            \\"mapped_offset_x\\": 0.0,\\n            \\"palm_center_x\\": None,\\n            \\"palm_center_y\\": None,\\n            \\"palm_move\\": 0.0,\\n            \\"tick_state\\": self.tick_state,\\n            \\"tick_direction\\": self.tick_direction,\\n            \\"left_tick_detected\\": False,\\n            \\"right_tick_detected\\": False,\\n            \\"cooldown_remaining\\": 0.0,\\n            \\"confirmed_gesture\\": None,\\n        }\\n\\n    def _get_distance(self, p1, p2):\\n        return math.sqrt((p1.x - p2.x) ** 2 + (p1.y - p2.y) ** 2)\\n\\n    def _get_distance_3d(self, p1, p2):\\n        return math.sqrt(\\n            (p1.x - p2.x) ** 2 +\\n            (p1.y - p2.y) ** 2 +\\n            (getattr(p1, \\"z\\", 0.0) - getattr(p2, \\"z\\", 0.0)) ** 2\\n        )\\n\\n    def _projection_ratio(self, p1, p2):\\n        distance_3d = self._get_distance_3d(p1, p2)\\n        if distance_3d <= 1e-6:\\n            return 1.0\\n        return self._get_distance(p1, p2) / distance_3d\\n\\n    def _make_point(self, x, y, z=0.0):\\n        class P:\\n            pass\\n\\n        p = P()\\n        p.x = x\\n        p.y = y\\n        p.z = z\\n        return p\\n\\n    def _average_point(self, poi m_center, base_center, tip_center, palm_size):\\n        aim_vector_x = (tip_center.x - base_center.x) / palm_size\\n        aim_vector_y = (tip_center.y - base_center.y) / palm_size\\n        aim_vector_z = (tip_center.z - base_center.z) / palm_size\\n        aim_projection_ratio = self._projection_ratio(tip_center, base_center)\\n        aim_depth_ok = (\\n            abs(aim_vector_z) > self.FOUR_FINGER_AIM_Z_THRESHOLD or\\n            aim_projection_ratio < self.FOUR_FINGER_AIM_PROJECTION_RATIO_MAX\\n        )\\n\\n        if self.neutral_palm_x is None:\\n            self.neutral_palm_x = palm_center.x\\n            self.neutral_palm_y = palm_center.y\\n\\n        palm_move_from_start = math.sqrt(\\n            (palm_center.x - self.neutral_palm_x) ** 2 +\\n            (palm_center.y - self.neutral_palm_y) ** 2\\n        ) / palm_size\\n        cooldown_remaining = 0.0\\n\\n        self.four_finger_swipe_history.append((\\n            current_time,\\n            tip_center.x - palm_center.x,\\n            tip_center.y - palm_center.y,\\n            palm_center.x,\\n            palm_center.y,\\n        ))\\n\\n        swipe_delta_x = 0.0\\n        swipe_delta_y = 0.0\\n        swipe_elapsed = 0.0\\n        palm_delta = 0.0\\n        swipe_turns = 0\\n        current_tip_offset_x = tip_center.x - palm_center.x\\n        current_tip_offset_y = tip_center.y - palm_center.y\\n        for sample_time, sample_tip_offset_x, sample_tip_offset_y, sample_palm_x, sample_palm_y in self.four_finger_swipe_history:\\n            elapsed = current_time - sample_time\\n            if elapsed < self.FOUR_FINGER_SWIPE_MIN_TIME or elapsed > self.FOUR_FINGER_SWIPE_MAX_TIME:\\n                continue\\n\\n            candidate_dx = (current_tip_offset_x - sample_tip_offset_x) / palm_size\\n            if abs(candidate_dx) <= abs(swipe_delta_x):\\n                continue\\n\\n            swipe_delta_x = candidate_dx\\n            swipe_delta_y = (current_tip_offset_y - sample_tip_offset_y) / palm_size\\n            swipe_elapsed = elapsed\\n            palm_delta = math.sqrt(\\n                (palm_center.x - sample_palm_x) ** 2 +\\n                (palm_center.y - sample_palm_y) ** 2\\n            ) / palm_size\\n\\n        offset_steps = [\\n            self.four_finger_swipe_history[i][1] - self.four_finger_swipe_history[i - 1][1]\\n            for i in range(1, len(self.four_finger_swipe_history))\\n        ]\\n        offset_signs = [\\n            1 if step > 0 else -1\\n            for step in offset_steps\\n            if abs(step) / palm_size > 0.01\\n        ]\\n        swipe_turns = sum(\\n            1\\n            for i in range(1, len(offset_signs))\\n            if offset_signs[i] != offset_signs[i - 1]\\n        )\\n\\n        mapped_offset_x = -swipe_delta_x if self.MIRROR_TICK_DIRECTION else swipe_delta_x\\n        if self.tick_state == \\"COOLDOWN\\":\\n            cooldown_remaining = max(\\n                0.0,\\n                self.TICK_COOLDOWN - (current_time - self.cooldown_start_time),\\n            )\\n\\n        self.debug_state.update({\\n            \\"four_finger_aim_candidate\\": True,\\n            \\"aim_vector_x\\": aim_vector_x,\\n            \\"aim_vector_y\\": aim_vector_y,\\n            \\"aim_vector_z\\": aim_vector_z,\\n            \\"aim_depth_ok\\": aim_depth_ok,\\n            \\"aim_projection_ratio\\": aim_projection_ratio,\\n            \\"finger_offset_x\\": aim_vector_x,\\n            \\"relative_offset_x\\": swipe_delta_x,\\n            \\"mapped_offset_x\\": mapped_offset_x,\\n            \\"finger_offset_y\\": aim_vector_y,\\n            \\"relative_offset_y\\": swipe_delta_y,\\n            \\"palm_center_x\\": palm_center.x,\\n            \\"palm_center_y\\": palm_center.y,\\n            \\"palm_move\\": palm_delta,\\n            \\"swipe_delta_x\\": swipe_delta_x,\\n            \\"swipe_delta_y\\": swipe_delta_y,\\n            \\"swipe_elapsed\\": swipe_elapsed,\\n            \\"swipe_turns\\": swipe_turns,\\n            \\"four_finger_reject_reason\\": \\"\\",\\n            \\"tick_state\\": self.tick_state,\\n            \\"tick_direction\\": self.tick_direction,\\n            \\"cooldown_remaining\\": cooldown_remaining,\\n        })\\n\\n        def reject(reason):\\n            self.debug_state[\\"four_finger_reject_reason\\"] = reason\\n            return None\\n\\n        if self.tick_state != \\"READY\\":\\n            if cooldown_remaining <= 0:\\n                return reject(\\"release_needed\\")\\n            return reject(\\"cooldown\\")\\n\\n        if not aim_depth_ok:\\n            return reject(\\"depth\\")\\n\\n        if palm_move_from_start >= self.FOUR_FINGER_PALM_STABILITY_MAX:\\n            return reject(\\"palm_start\\")\\n\\n        if palm_delta >= self.FOUR_FINGER_SWIPE_PALM_MAX:\\n            return reject(\\"palm_delta\\")\\n\\n        if abs(swipe_delta_y) >= self.FOUR_FINGER_SWIPE_Y_MAX:\\n            return reject(\\"vertical\\")\\n\\n        if swipe_turns > self.FOUR_FINGER_MAX_DIRECTION_TURNS:\\n            return reject(\\"turns\\")\\n\\n        if abs(swipe_delta_x) < palm_delta * self.FOUR_FINGER_SWIPE_TO_PALM_RATIO:\\n            return reject(\\"palm_ratio\\")\\n\\n        if abs(swipe_delta_x) < abs(swipe_delta_y) * self.FOUR_FINGER_HORIZONTAL_RATIO:\\n            return reject(\\"horizontal\\")\\n\\n        if mapped_offset_x > self.FOUR_FINGER_SWIPE_THRESHOLD:\\n            self.tick_state = \\"TRIGGERED_RIGHT\\"\\n            self.tick_direction = \\"RIGHT\\"\\n            self.cooldown_start_time = current_time\\n            self.four_finger_swipe_history.clear()\\n            self.debug_state[\\"tick_state\\"] = \\"TRIGGERED_RIGHT\\"\\n            self.debug_state[\\"tick_direction\\"] = self.tick_direction\\n            self.debug_state[\\"right_tick_detected\\"] = True\\n            self.debug_state[\\"cooldown_remaining\\"] = self.TICK_COOLDOWN\\n            self.tick_state = \\"COOLDOWN\\"\\n            return \\"FOUR_FINGER_AIM_RIGHT\\"\\n\\n        if mapped_offset_x < -self.FOUR_FINGER_SWIPE_THRESHOLD:\\n            self.tick_state = \\"TRIGGERED_LEFT\\"\\n            self.tick_direction = \\"LEFT\\"\\n            self.cooldown_start_time = current_time\\n            self.four_finger_swipe_history.clear()\\n            self.debug_state[\\"tick_state\\"] = \\"TRIGGERED_LEFT\\"\\n            self.debug_state[\\"tick_direction\\"] = self.tick_direction\\n            self.debug_state[\\"left_tick_detected\\"] = True\\n            self.debug_state[\\"cooldown_remaining\\"] = self.TICK_COOLDOWN\\n            self.tick_state = \\"COOLDOWN\\"\\n            return \\"FOUR_FINGER_AIM_LEFT\\"\\n\\n        return reject(\\"threshold\\")\\n\\n    def extract_full_state(self, results):\\n        if not results or getattr(results, \\"multi_hand_landmarks\\", None) is None:\\n            self._reset_temporal_state()\\n            return {\\n                \\"hand_present\\": False,\\n                \\"gesture\\": None,\\n                \\"value\\": None,\\n                \\"wrist_x\\": None,\\n                \\"index_x\\": None,\\n                \\"servo_angle\\": 0,\\n                \\"move_dist\\": 0.0,\\n                **self.debug_state,\\n            }\\n\\n        hand_landmarks = results.multi_hand_landmarks[0]\\n        landmarks = hand_landmarks.landmark\\n\\n        current_time = time.time()\\n        wrist = landmarks[self.WRIST]\\n        self.wrist_history.append((current_time, wrist.x, wrist.y))\\n\\n        while self.wrist_history and current_time - self.wrist_history[0][0] > 3.0:\\n            self.wrist_history.popleft()\\n\\n        move_dist = 0.0\\n        if len(self.wrist_history) > 10:\\n            xs = [x for _, x, _ in self.wrist_history]\\n            ys = [y for _, _, y in self.wrist_history]\\n            move_dist = (max(xs) - min(xs)) + (max(ys) - min(ys))\\n\\n        gesture, value = self.recognize(landmarks, move_dist, current_time)\\n        self.debug_state[\\"confirmed_gesture\\"] = gesture\\n\\n        dx = landmarks[self.INDEX_FINGER_TIP].x - landmarks[self.WRIST].x\\n        dy = landmarks[self.INDEX_FINGER_TIP].y - landmarks[self.WRIST].y\\n        angle_rad = math.atan2(dx, -dy)\\n        servo_angle = int((math.degrees(angle_rad) + 360) % 360)\\n\\n        return {\\n            \\"hand_present\\": True,\\n            \\"gesture\\": gesture,\\n            \\"value\\": value,\\n            \\"wrist_x\\": wrist.x,\\n            \\"index_x\\": landmarks[self.INDEX_FINGER_TIP].x,\\n            \\"servo_angle\\": servo_angle,\\n            \\"move_dist\\": move_dist,\\n            **self.debug_state,\\n        }\\n\\n    def recognize(self, landmarks, move_dist, current_time=None):\\n        if current_time is None:\\n            current_time = time.time()\\n\\n        self.debug_state = self._empty_debug_state()\\n\\n        dist_index = self._get_distance(landmarks[self.INDEX_FINGER_TIP], landmarks[self.WRIST])\\n        dist_middle = self._get_distance(landmarks[self.MIDDLE_FINGER_TIP], landmarks[self.WRIST])\\n        dist_ring = self._get_distance(landmarks[self.RING_FINGER_TIP], landmarks[self.WRIST])\\n        dist_pinky = self._get_distance(landmarks[self.PINKY_TIP], landmarks[self.WRIST])\\n\\n        wrist_to_index_mcp = self._get_distance(landmarks[self.INDEX_FINGER_MCP], landmarks[self.WRIST])\\n        wrist_to_middle_mcp = self._get_distance(landmarks[self.MIDDLE_FINGER_MCP], landmarks[self.WRIST])\\n\\n        index_open = dist_index > wrist_to_index_mcp * 1.2\\n        middle_open = dist_middle > wrist_to_middle_mcp * 1.25\\n        ring_open = dist_ring > wrist_to_middle_mcp * 1.25\\n        pinky_open = dist_pinky > wrist_to_middle_mcp * 1.15\\n\\n        self.debug_state.update({\\n            \\"index_open\\": index_open,\\n            \\"middle_open\\": middle_open,\\n            \\"ring_open\\": ring_open,\\n            \\"pinky_open\\": pinky_open,\\n        })\\n\\n        thumb_tip = landmarks[self.THUMB_TIP]\\n        thumb_mcp = landmarks[self.THUMB_MCP]\\n        index_tip = landmarks[self.INDEX_FINGER_TIP]\\n        palm_center = self._get_palm_center_point(landmarks)\\n        palm_ref = self._get_distance(landmarks[self.MIDDLE_FINGER_MCP], landmarks[self.WRIST])\\n        palm_width = self._get_distance(\\n            landmarks[self.INDEX_FINGER_MCP],\\n            landmarks[self.PINKY_MCP],\\n        )\\n        palm_size = max(palm_ref, palm_width, 1e-6)\\n\\n        thumb_palm_dist = self._get_distance(thumb_tip, palm_center)\\n        thumb_folded = thumb_palm_dist < palm_ref * 0.70\\n        thumb_tip_to_mcp = self._get_distance(thumb_tip, thumb_mcp)\\n        thumb_open = (\\n            not thumb_folded and\\n            thumb_tip_to_mcp > palm_size * 0.28\\n        )\\n\\n        index_ratio = dist_index / max(wrist_to_index_mcp, 1e-6)\\n        middle_ratio = dist_middle / max(wrist_to_middle_mcp, 1e-6)\\n        ring_ratio = dist_ring / max(wrist_to_middle_mcp, 1e-6)\\n        pinky_ratio = dist_pinky / max(wrist_to_middle_mcp, 1e-6)\\n        avg_ratio = (index_ratio + middle_ratio + ring_ratio + pinky_ratio) / 4.0\\n\\n        is_fist = (\\n            avg_ratio < 1.18 and\\n            middle_ratio < 1.20 and\\n            ring_ratio < 1.20 and\\n            pinky_ratio < 1.20 and\\n            index_ratio < 1.30 and\\n            thumb_folded\\n        )\\n\\n        other_three_folded = not middle_open and not ring_open and not pinky_open\\n        thumb_direction_delta = (thumb_tip.y - thumb_mcp.y) / palm_size\\n        thumb_direction_clear = abs(thumb_direction_delta) > self.THUMB_DIRECTION_THRESHOLD\\n        thumb_only = thumb_open and not index_open and not middle_open and not ring_open and not pinky_open\\n        thumbs_up_candidate = (\\n            thumb_only and\\n            thumb_direction_clear and\\n            thumb_tip.y < thumb_mcp.y\\n        )\\n        thumbs_down_candidate = (\\n            thumb_only and\\n            thumb_direction_clear and\\n            thumb_tip.y > thumb_mcp.y\\n        )\\n        raw_thumb_gesture = None\\n        if thumbs_up_candidate:\\n            raw_thumb_gesture = \\"THUMBS_UP\\"\\n        elif thumbs_down_candidate:\\n            raw_thumb_gesture = \\"THUMBS_DOWN\\"\\n\\n        self.thumb_gesture_history.append(raw_thumb_gesture)\\n        confirmed_thumb_gesture = None\\n        for candidate in (\\"THUMBS_UP\\", \\"THUMBS_DOWN\\"):\\n            if sum(1 for item in self.thumb_gesture_history if item == candidate) >= self.THUMB_SMOOTHING_MIN_HITS:\\n                confirmed_thumb_gesture = candidate\\n                break\\n        open_palm = index_open and middle_open and ring_open and pinky_open\\n        index_aim_open = self._get_distance_3d(\\n            landmarks[self.INDEX_FINGER_TIP],\\n            landmarks[self.INDEX_FINGER_MCP],\\n        ) > palm_size * self.FOUR_FINGER_OPEN_3D_THRESHOLD\\n        middle_aim_open = self._get_distance_3d(\\n            landmarks[self.MIDDLE_FINGER_TIP],\\n            landmarks[self.MIDDLE_FINGER_MCP],\\n        ) > palm_size * self.FOUR_FINGER_OPEN_3D_THRESHOLD\\n        ring_aim_open = self._get_distance_3d(\\n            landmarks[self.RING_FINGER_TIP],\\n            landmarks[self.RING_FINGER_MCP],\\n        ) > palm_size * self.FOUR_FINGER_OPEN_3D_THRESHOLD\\n        pinky_aim_open = self._get_distance_3d(\\n            landmarks[self.PINKY_TIP],\\n            landmarks[self.PINKY_MCP],\\n        ) > palm_size * self.FOUR_FINGER_OPEN_3D_THRESHOLD\\n        # POINT_MODE enters the point-control mode. The actual POINT gesture is\\n        # kept separate so it can be reassigned/tuned independently.\\n        point_mode_candidate = (\\n            thumb_open and\\n            index_open and\\n            not middle_open and\\n            not ring_open and\\n            pinky_open and\\n            not open_palm and\\n            not is_fist\\n        )\\n        # POINT should work at distance too, so avoid absolute screen-space\\n        # distance checks. The core shape is index open with the other fingers\\n        # folded; the thumb may be folded or relaxed.\\n        is_point = (\\n            index_open and\\n            other_three_folded and\\n            not open_palm and\\n            not is_fist\\n        )\\n        is_mode_switch = (\\n            not index_open and\\n            not middle_open and\\n            not ring_open and\\n            pinky_open\\n        )\\n\\n        four_finger_base_center = self._get_four_finger_base_center_point(landmarks)\\n        four_finger_tip_center = self._get_four_finger_tip_center_point(landmarks)\\n        aim_vector_x = (four_finger_tip_center.x - four_finger_base_center.x) / palm_size\\n        aim_vector_y = (four_finger_tip_center.y - four_finger_base_center.y) / palm_size\\n        aim_vector_z = (four_finger_tip_center.z - four_finger_base_center.z) / palm_size\\n        aim_projection_ratio = self._projection_ratio(four_finger_tip_center, four_finger_base_center)\\n        aim_depth_ok = (\\n            abs(aim_vector_z) > self.FOUR_FINGER_AIM_Z_THRESHOLD or\\n            aim_projection_ratio < self.FOUR_FINGER_AIM_PROJECTION_RATIO_MAX\\n        )\\n        # FOUR_FINGER_AIM은 라파 환경에서 노이즈가 많아 비활성화 (rasp 동기)\\n        four_finger_aim_candidate = False\\n        fist_blocked_by_four_finger_aim = (\\n            is_fist and\\n            four_finger_aim_candidate and\\n            aim_depth_ok\\n        )\\n        self.debug_state.update({\\n            \\"point_mode_candidate\\": point_mode_candidate,\\n            \\"four_finger_aim_candidate\\": four_finger_aim_candidate,\\n            \\"aim_vector_x\\": aim_vector_x,\\n            \\"aim_vector_y\\": aim_vector_y,\\n            \\"aim_vector_z\\": aim_vector_z,\\n            \\"aim_depth_ok\\": aim_depth_ok,\\n            \\"aim_projection_ratio\\": aim_projection_ratio,\\n            \\"fist_blocked_b
